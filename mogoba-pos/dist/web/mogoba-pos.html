  function mount(el) {
    if (!view.day) view.day = U.addDays(U.dayKey(), -1);
    const body = h('div.stack');
    const search = h('input.input', { type: 'search', placeholder: 'Order no., name or table', 'aria-label': 'Search orders', value: view.q });
    const dayIn = h('input.input', { type: 'date', value: view.day, max: U.dayKey(), 'aria-label': 'Day', style: { maxWidth: '190px' } });
    const tabsBox = h('div');
    const tools = h('div.row-gap', h('div.search.grow', ui().icon('search', 20), search));
    U.mount(el, h('div.page', h('div.panel.glass.stack', tabsBox, tools, body)));
    let past = [];

    search.addEventListener('input', () => {
      view.q = search.value;
      draw();
    });
    dayIn.addEventListener('change', async () => {
      if (!dayIn.value) return;
      view.day = dayIn.value;
      past = await C.ordersBetween(view.day, view.day);
      draw();
    });
    const filter = (list) => {
      const q = view.q.trim().toLowerCase();
      if (!q) return list;
      return list.filter((o) => (o.no + ' #' + o.queue + ' ' + (o.customer || '') + ' t' + (o.table || '') + ' ' + summary(o)).toLowerCase().includes(q));
    };
    const open = (o) => detail(o);

    let onlineDraw = null;
    function draw() {
      const today = S.today.filter((o) => o.status !== 'open');
      const queue = today.filter((o) => o.status === 'paid' && o.kitchen !== 'done').sort((a, b) => a.paidAt - b.paidAt);
      const online = M.online && S.settings.online && S.settings.online.enabled;
      if (view.tab === 'online' && !online) view.tab = 'queue';
      const tabs = [['queue', 'Kitchen (' + queue.length + ')']];
      if (online) tabs.push(['online', 'Online (' + M.online.pendingCount() + ')']);
      tabs.push(['today', 'Today (' + today.length + ')'], ['past', 'Past days']);
      U.mount(
        tabsBox,
        ui().seg(tabs, view.tab, async (v) => {
          view.tab = v;
          if (v === 'past') past = await C.ordersBetween(view.day, view.day);
          draw();
        }, 'Order list')
      );
      tools.hidden = view.tab === 'online';
      if (view.tab === 'past') {
        if (!tools.contains(dayIn)) tools.append(dayIn);
      } else if (tools.contains(dayIn)) dayIn.remove();
      if (view.tab === 'online') {
        onlineDraw = M.online.panel(body);
        return;
      }
      onlineDraw = null;

      if (view.tab === 'queue') {
        const list = filter(queue);
        if (!list.length) return U.mount(body, ui().empty('Kitchen is clear', 'Paid orders show here until they are picked up.'));
        U.mount(
          body,
          h(
            'div.list',
            list.map((o) =>
              h(
                'div.row',
                h('span.q-no', '#' + o.queue),
                h('span.wait', { class: waitClass(o.paidAt), title: 'Minutes waiting' }, Math.max(0, Math.round((Date.now() - o.paidAt) / 60000)) + "'"),
                h('button.grow', { type: 'button', style: { textAlign: 'left' }, onclick: () => open(o) }, h('div.t', summary(o)), h('div.s', U.fmtTime(o.paidAt) + ' · ' + C.TYPES[o.type] + (o.table ? ' T' + o.table : '') + (o.customer ? ' · ' + o.customer : ''))),
                o.kitchen === 'ready'
                  ? h('button.btn.go', { type: 'button', onclick: async () => (await C.setKitchen(o, 'done'), draw()) }, ui().icon('check', 18), 'Picked up')
                  : h('button.btn.gold', { type: 'button', onclick: async () => (await C.setKitchen(o, 'ready'), draw()) }, 'Mark ready')
              )
            )
          )
        );
        return;
      }
      const list = filter((view.tab === 'today' ? today : past).slice().sort((a, b) => b.paidAt - a.paidAt));
      if (!list.length) return U.mount(body, ui().empty(view.q ? 'No matching orders' : 'No orders', view.tab === 'today' ? 'Sales you ring up today appear here.' : 'Pick another day.'));
      const net = list.reduce((t, o) => t + L.orderNet(o), 0);
      U.mount(body, h('div.row-gap.muted', { style: { fontSize: '13px', fontWeight: 700 } }, list.length + ' orders · net ' + U.peso(net)), h('div.list', list.map((o) => orderRow(o, open))));
    }
    draw();
    const offs = [
      M.bus.on('change', async () => {
        if (view.tab === 'past') past = await C.ordersBetween(view.day, view.day);
        draw();
      }),
      M.bus.on('online', () => (view.tab === 'online' && onlineDraw ? onlineDraw() : draw())),
      M.bus.on('orders:tab', (t) => {
        view.tab = t;
        draw();
      }),
    ];
    const tick = setInterval(() => view.tab === 'queue' && draw(), 30000);
    return () => {
      clearInterval(tick);
      offs.forEach((f) => f());
    };
  }

  M.views = M.views || {};
  M.views.orders = { title: 'Orders', icon: 'orders', perm: 'orders', mount };
  M.ordersView = { detail };
})((window.M = window.M || {}));

/* js/views/stock.js */
/* Mogoba POS: Stock. On-hand comes from the movement ledger; lots carry expiry dates and
 * leave first-expiry-first-out. */
(function (M) {
  'use strict';
  const U = M.util;
  const L = M.logic;
  const C = M.core;
  const S = M.state;
  const h = U.h;
  const ui = () => M.ui;

  const view = { group: 'all', q: '' };
  let usage = {};
  const MOVE = { sale: 'Sold', receive: 'Received', waste: 'Waste', count: 'Count', void: 'Void return', refund: 'Refund return', adjust: 'Adjusted' };
  /* Remove reasons that are waste show up in waste reports; the rest are corrections. */
  /* [label, kind, rule]: rule 'note' needs a note, 'pin' needs a manager PIN. */
  const REASONS = {
    remove: [['Expired', 'waste'], ['Spoiled', 'waste'], ['Dropped or damaged', 'waste'], ['Cooking error', 'waste'], ['Remake', 'waste'], ['Staff meal', 'waste'], ['Sample', 'waste'], ['Return to supplier', 'adjust'], ['Lost or theft', 'adjust', 'pin'], ['Correction', 'adjust', 'note']],
    add: [['Transfer in', 'adjust'], ['Found in storage', 'adjust'], ['Free goods', 'adjust'], ['Correction', 'adjust', 'note']],
  };
  const PIN_OVER = 50000;

  /* Counting unit: kg / L for bulk, pieces otherwise. */
  const cu = (ing) => (ing.unit === 'g' ? ['kg', 1000] : ing.unit === 'ml' ? ['L', 1000] : ['pc', 1]);
  const groups = () => Array.from(new Set(Object.values(S.ings).filter((i) => i.active !== false).map((i) => i.group)));
  const ingList = () => Object.values(S.ings).filter((i) => i.active !== false).sort((a, b) => (a.sort || 0) - (b.sort || 0));
  const value = (ing) => Math.max(0, ing.onHand) * (ing.cost || 0);
  const perBuy = (ing) => (ing.cost || 0) * (ing.buyFactor || 1);
  const today = () => U.dayKey();
  const daysLeft = (ing) => {
    const u = usage[ing.id];
    return u > 0 ? Math.max(0, ing.onHand) / u : null;
  };
  const coverText = (dl) => (dl < 1 ? 'under 1 day' : (dl < 3 ? U.trim(Math.floor(dl * 10) / 10) : Math.floor(dl)) + ' d cover');
  const expiryDefault = (ing) => (ing && ing.shelfLife ? U.addDays(today(), ing.shelfLife) : '');

  function ingSelect(selected) {
    const sel = h('select.input', { 'aria-label': 'Item' }, h('option', { value: '' }, 'Choose item'));
    for (const g of groups()) sel.append(h('optgroup', { label: g }, ingList().filter((x) => x.group === g).map((i) => h('option', { value: i.id, selected: i.id === selected }, i.name))));
    return sel;
  }
  const numIn = (val, label) => h('input.input.num', { type: 'text', inputmode: 'decimal', value: val == null ? '' : String(val), 'aria-label': label, placeholder: '0' });
  const parseNum = (s) => {
    const v = parseFloat(String(s).replace(/,/g, ''));
    return isFinite(v) ? v : NaN;
  };
  const dateIn = (val, label) => h('input.input', { type: 'date', value: val || '', 'aria-label': label, min: U.addDays(today(), -30) });

  /* Every expiring or expired lot across stock, most urgent first. */
  function expiringLots() {
    const t = today();
    const out = [];
    for (const ing of ingList()) {
      for (const lot of L.lotsOf(ing)) {
        if (!lot.exp || !(lot.qty > 0)) continue;
        const state = L.expiryState(lot.exp, t, L.soonWindow(ing));
        if (state === 'soon' || state === 'expired') out.push({ ing, lot, state, days: L.daysUntil(lot.exp, t) });
      }
    }
    return out.sort((a, b) => a.days - b.days);
  }

  async function writeOff(entries) {
    try {
      await C.waste(entries.map((x) => ({ ing: x.ing.id, qty: x.lot.qty, lot: x.lot.id })), 'Expired');
      ui().toast('Written off ' + entries.length + (entries.length === 1 ? ' lot.' : ' lots.'), 'ok');
    } catch (e) {
      ui().toast(e.message, 'err');
    }
  }

  /* ---------- receive ---------- */
  function receiveSheet(prefill) {
    const rows = [];
    const s = ui().sheet({ title: 'Receive delivery', wide: true, icon: 'truck' });
    const supplier = h('input.input', { placeholder: 'Supplier', 'aria-label': 'Supplier', maxlength: 60 });
    const ref = h('input.input', { placeholder: 'Invoice or DR no.', 'aria-label': 'Invoice number', maxlength: 40 });
    const list = h('div.stack-sm');
    const totalEl = h('b.num');
    const addRow = (ingId, buyQty) => {
      const ing = S.ings[ingId];
      rows.push({ ing: ingId || '', qty: buyQty || '', cost: ing ? (perBuy(ing) / 100).toFixed(2) : '', exp: expiryDefault(ing) });
      if (ing && ing.supplier && !supplier.value) supplier.value = ing.supplier;
      draw();
    };
    const recalc = () => {
      let t = 0;
      for (const r of rows) {
        const q = parseNum(r.qty);
        const c = U.toCents(r.cost);
        if (q > 0 && c >= 0) t += q * c;
      }
      totalEl.textContent = U.peso(Math.round(t));
    };
    function draw() {
      U.mount(
        list,
        rows.map((r, i) => {
          const ing = S.ings[r.ing];
          const sel = ingSelect(r.ing);
          sel.addEventListener('change', () => {
            r.ing = sel.value;
            const n = S.ings[r.ing];
            if (n) {
              r.cost = (perBuy(n) / 100).toFixed(2);
              r.exp = expiryDefault(n);
            }
            draw();
          });
          const q = numIn(r.qty, 'Quantity');
          q.addEventListener('input', () => ((r.qty = q.value), recalc()));
          const c = numIn(r.cost, 'Cost per unit');
          c.addEventListener('input', () => ((r.cost = c.value), recalc()));
          const e = dateIn(r.exp, 'Expiry date');
          e.addEventListener('change', () => (r.exp = e.value));
          const quick = h('span.quick-exp', [1, 3, 7].map((d) => h('button', { type: 'button', 'aria-label': 'Expires in ' + d + ' days', onclick: () => ((r.exp = U.addDays(today(), d)), (e.value = r.exp)) }, '+' + d + 'd')));
          return h(
            'div.recv-row',
            h('label.field', h('span', 'Item'), sel),
            h('label.field', h('span', 'Qty' + (ing ? ' (' + ing.buyUnit + ')' : '')), q),
            h('label.field', h('span', '₱ per ' + (ing ? ing.buyUnit : 'unit')), c),
            h('div.field', h('span', 'Expires', quick), e),
            h('button.icon-btn', { type: 'button', 'aria-label': 'Remove row', onclick: () => (rows.splice(i, 1), draw()) }, ui().icon('x', 18))
          );
        }),
        h('button.btn.sm', { type: 'button', style: { alignSelf: 'flex-start' }, onclick: () => addRow('') }, ui().icon('plus', 18), 'Add item')
      );
      recalc();
    }
    for (const p of prefill || [{}]) addRow(p.ing || '', p.buyQty || '');
    s.setBody(h('div.form-grid', supplier, ref), h('div.group-label', 'Items'), list, h('div.sumrow.total', { style: { marginTop: '14px' } }, h('span.lbl', 'Total'), totalEl));
    s.setFoot(
      h(
        'button.btn.go.lg.block',
        {
          type: 'button',
          onclick: async () => {
            const out = [];
            for (const r of rows) {
              const ing = S.ings[r.ing];
              const q = parseNum(r.qty);
              if (!ing || !(q > 0)) continue;
              const c = U.toCents(r.cost);
              if (!(c >= 0)) return ui().toast('Check the cost for ' + ing.name + '.', 'err');
              if (r.exp && r.exp < today()) return ui().toast(ing.name + ' is already past its expiry date.', 'err');
              out.push({ ing: ing.id, qty: q * ing.buyFactor, unitCost: c / ing.buyFactor, exp: r.exp || '' });
            }
            if (!out.length) return ui().toast('Enter a quantity for at least one item.', 'err');
            const up = out.filter((x) => S.ings[x.ing].cost > 0 && x.unitCost > S.ings[x.ing].cost * 1.1).map((x) => S.ings[x.ing].name + ' +' + Math.round((x.unitCost / S.ings[x.ing].cost - 1) * 100) + '%');
            try {
              await C.receive(out, { supplier: supplier.value.trim(), ref: ref.value.trim() });
              s.close();
              if (up.length) ui().toast('Stock received. Cost up: ' + up.join(', ') + '. Check menu prices.', 'err', 6000);
              else ui().toast('Stock received.', 'ok');
            } catch (e) {
              ui().toast(e.message, 'err');
            }
          },
        },
        ui().icon('check', 20),
        'Receive'
      )
    );
  }

  /* ---------- add or remove ---------- */
  function adjustSheet(ingId, startDir) {
    let dir = startDir || 'remove';
    let reason = '';
    let note = '';
    const rows = [{ ing: ingId || '', qty: '', exp: '' }];
    const s = ui().sheet({ title: 'Add or remove stock', icon: 'stock' });
    function draw() {
      const reasons = REASONS[dir];
      if (!reasons.some((r) => r[0] === reason)) reason = '';
      s.setBody(
        ui().seg([['remove', 'Remove'], ['add', 'Add']], dir, (v) => ((dir = v), draw()), 'Direction'),
        h('div.group-label', 'Reason'),
        h('div.chips', reasons.map(([r]) => h('button.chip', { type: 'button', 'aria-pressed': String(reason === r), onclick: () => ((reason = r), draw()) }, r))),
        (reasons.find((x) => x[0] === reason) || [])[2] === 'note'
          ? (() => {
              const n = h('input.input', { value: note, placeholder: 'What happened', 'aria-label': 'Note', maxlength: 120, style: { marginTop: '8px' } });
              n.addEventListener('input', () => (note = n.value));
              return n;
            })()
          : null,
        h('div.group-label', 'Items'),
        h(
          'div.stack-sm',
          rows.map((r, i) => {
            const ing = S.ings[r.ing];
            const sel = ingSelect(r.ing);
            sel.addEventListener('change', () => ((r.ing = sel.value), (r.exp = expiryDefault(S.ings[r.ing])), draw()));
            const q = numIn(r.qty, 'Quantity');
            q.addEventListener('input', () => (r.qty = q.value));
            const e = dateIn(r.exp, 'Expiry date');
            e.addEventListener('change', () => (r.exp = e.value));
            return h(
              'div.adj-row',
              { class: dir === 'add' ? 'with-exp' : '' },
              h('label.field', h('span', 'Item'), sel),
              h('label.field', h('span', 'Qty' + (ing ? ' (' + cu(ing)[0] + ')' : '')), q),
              dir === 'add' ? h('label.field', h('span', 'Expires'), e) : null,
              h('button.icon-btn', { type: 'button', 'aria-label': 'Remove row', onclick: () => (rows.splice(i, 1), rows.length || rows.push({ ing: '', qty: '', exp: '' }), draw()) }, ui().icon('x', 18))
            );
          }),
          h('button.btn.sm', { type: 'button', style: { alignSelf: 'flex-start' }, onclick: () => (rows.push({ ing: '', qty: '', exp: '' }), draw()) }, ui().icon('plus', 18), 'Add item')
        )
      );
      s.setFoot(h('button.btn.lg.block', { type: 'button', class: dir === 'remove' ? 'danger-solid' : 'go', onclick: save }, dir === 'remove' ? 'Remove from stock' : 'Add to stock'));
    }
    async function save() {
      if (!reason) return ui().toast('Pick a reason.', 'err');
      const out = [];
      for (const r of rows) {
        const ing = S.ings[r.ing];
        const q = parseNum(r.qty);
        if (!ing || !(q > 0)) continue;
        const qty = q * cu(ing)[1];
        if (dir === 'remove' && qty > Math.max(0, ing.onHand) + 1e-6) return ui().toast('Only ' + U.fmtQty(Math.max(0, ing.onHand), ing.unit) + ' of ' + ing.name + ' on hand.', 'err');
        out.push({ ing: ing.id, qty, exp: dir === 'add' ? r.exp || '' : '' });
      }
      if (!out.length) return ui().toast('Enter a quantity.', 'err');
      const [, kind, rule] = REASONS[dir].find((x) => x[0] === reason);
      if (rule === 'note' && !note.trim()) return ui().toast('Add a note for the correction.', 'err');
      const worth = out.reduce((t, x) => t + x.qty * (S.ings[x.ing].cost || 0), 0);
      if (rule || worth > PIN_OVER) {
        const ap = await ui().approve('stock', 'Approve stock change', 'Corrections, losses and changes over ' + U.peso0(PIN_OVER) + ' need a manager PIN.');
        if (!ap) return;
      }
      const why = reason + (note.trim() ? ': ' + note.trim() : '');

        if (dir === 'remove' && kind === 'waste') await C.waste(out, why);

        ui().toast(dir === 'remove' ? 'Removed from stock.' : 'Added to stock.', 'ok');

        ui().toast(e.message, 'err');
      }
    }

  }

  function mount(el) {
    const head = h('div.page-head', h('h2', 'Stock'));

    if (edit) {
      head.append(

        h('button.btn', { type: 'button', onclick: () => adjustSheet() }, ui().icon('stock', 20), h('span', 'Add / remove')),
        h('button.btn', { type: 'button', onclick: () => countSheet() }, ui().icon('count', 20), h('span', 'Count')),
        h('button.icon-btn.boxed', { type: 'button', 'aria-label': 'New stock item', onclick: () => editSheet(null) }, ui().icon('plus'), h('span.show-phone', 'New item'))
      );
    }
    const top = h('div.cards.cards-3');
    const expiring = h('div');
    const chips = h('div.tabs');
    const search = h('input.input', { type: 'search', placeholder: 'Search stock', 'aria-label': 'Search stock', value: view.q });
    const table = h('div.list');
    U.mount(el, h('div.page', head, top, expiring, h('div.panel.glass.stack', h('div.search', ui().icon('search', 20), search), chips, table)));
    search.addEventListener('input', () => {
      view.q = search.value;
      drawTable();
    });

    function drawTop() {
      const all = ingList();
      const by = { ok: 0, low: 0, out: 0 };
      for (const i of all) by[L.stockStatus(i)]++;
      const val = all.reduce((t, i) => t + value(i), 0);
      const dailyCost = all.reduce((t, i) => t + (usage[i.id] || 0) * (i.cost || 0), 0);
      const exp = expiringLots();
      const expired = exp.filter((x) => x.state === 'expired');
      U.mount(
        top,
        h(
          'button.stat.glass',
          { type: 'button', onclick: () => ((view.group = 'alert'), drawChips(), drawTable()) },
          h('span.label', 'Stock health'),
          h('span.value', by.low + by.out ? by.out + ' out · ' + by.low + ' low' : 'All good'),
          ui().stackBar([{ value: by.ok, cls: 'c-ok', label: 'OK' }, { value: by.low, cls: 'c-low', label: 'Low' }, { value: by.out, cls: 'c-out', label: 'Out' }])
        ),
        h(
          'div.stat.glass',
          h('span.label', 'Expiring'),
          h('span.value', { style: expired.length ? { color: 'var(--bad)' } : exp.length ? { color: 'var(--warn)' } : null }, exp.length ? (expired.length ? expired.length + ' expired · ' : '') + (exp.length - expired.length) + ' soon' : 'Nothing soon'),
          h('span.sub', exp.length ? U.peso(Math.round(exp.reduce((t, x) => t + x.lot.qty * (x.ing.cost || 0), 0)), true) + ' at risk' : 'Lots are within date')
        ),
        h('div.stat.glass', h('span.label', 'Stock value'), h('span.value', U.peso(Math.round(val), true)), h('span.sub', dailyCost > 0 ? '≈ ' + Math.round(val / dailyCost) + ' days of use' : all.length + ' items'))
      );
      U.mount(
        expiring,
        exp.length
          ? h(
              'section.panel.glass',
              h('div.panel-title', h('h3', 'Use first'), expired.length && edit ? h('button.btn.sm.danger', { type: 'button', onclick: () => writeOff(expired) }, 'Write off ' + expired.length + ' expired') : null),
              h(
                'div.exp-list',
                exp.slice(0, 8).map((x) =>
                  h(
                    'button.exp-item',
                    { type: 'button', onclick: () => detailSheet(x.ing) },
                    h('span.grow', h('b', x.ing.name), h('span.muted', U.fmtQty(x.lot.qty, x.ing.unit))),
                    ui().expiryChip(x.days, x.state)
                  )
                )
              )
            )
          : null
      );
    }
    function drawChips() {
      const list = [['all', 'All'], ['alert', 'Low and out'], ['expiry', 'Expiring']].concat(groups().map((g) => [g, g]));
      U.mount(chips, list.map(([k, t]) => h('button.chip', { type: 'button', 'aria-pressed': String(view.group === k), onclick: () => ((view.group = k), drawChips(), drawTable()) }, t)));
    }
    function drawTable() {
      const q = view.q.trim().toLowerCase();
      const t = today();
      let list = ingList();
      if (view.group === 'alert') list = list.filter((i) => L.stockStatus(i) !== 'ok');
      else if (view.group === 'expiry') list = list.filter((i) => {
        const n = L.nextExpiry(i, t);
        return n && n.state !== 'ok';
      });
      else if (view.group !== 'all') list = list.filter((i) => i.group === view.group);
      if (q) list = list.filter((i) => (i.name + ' ' + i.group + ' ' + (i.supplier || '')).toLowerCase().includes(q));
      if (!list.length) return U.mount(table, ui().empty('Nothing here', q ? 'No item matches "' + view.q + '".' : 'No items in this view.'));
      U.mount(
        table,
        list.map((ing) => {
          const st = L.stockStatus(ing);
          const dl = daysLeft(ing);
          const n = L.nextExpiry(ing, t);
          return h(
            'button.row.stock-row',
            { type: 'button', onclick: () => detailSheet(ing) },
            h('div.grow', h('div.t', ing.name), h('div.s', ing.group + (dl != null ? ' · ' + coverText(dl) : ''))),
            h('div.stock-level.hide-phone', ui().level(ing.onHand, Math.max(ing.par, ing.onHand), { state: st, marker: ing.reorder, thin: true, label: ing.name + ' against par' })),
            h('span.amt', { style: { minWidth: '84px' } }, U.fmtQty(ing.onHand, ing.unit)),
            n && n.state !== 'ok' ? ui().expiryChip(n.days, n.state) : null,
            ui().badge(ui().STOCK_BADGE[st][0], ui().STOCK_BADGE[st][1])
          );
        })
      );
    }
    const all = () => {
      drawTop();
      drawChips();
      drawTable();
    };
    all();
    C.usage(14).then((u) => {
      usage = u;
      drawTop();
      drawTable();
    });
    const offs = [M.bus.on('stock', all), M.bus.on('change', all)];
    return () => offs.forEach((f) => f());
  }

  M.views = M.views || {};
  M.views.stock = { title: 'Stock', icon: 'stock', perm: 'orders', mount };
  M.stockView = { receiveSheet, adjustSheet, countSheet, reorderSheet, expiringLots };
})((window.M = window.M || {}));

  async function openShiftFlow() {

  /* QR images are resized in the browser so settings stay small and the code stays sharp. */
  function readQr(file) {
    return new Promise((res, rej) => {
      if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return rej(new Error('Use a PNG or JPG image of the QR code.'));
      const fr = new FileReader();
      fr.onerror = () => rej(new Error('Could not read that file.'));
      fr.onload = () => {
        const img = new Image();
        img.onerror = () => rej(new Error('That file is not a readable image.'));
        img.onload = () => {
          const k = Math.min(1, 900 / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * k);
          cv.height = Math.round(img.height * k);
          const cx = cv.getContext('2d');
          cx.imageSmoothingEnabled = k < 1;
          cx.fillStyle = '#fff';
          cx.fillRect(0, 0, cv.width, cv.height);
          cx.drawImage(img, 0, 0, cv.width, cv.height);
          res(cv.toDataURL('image/png'));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

      clock.textContent = new Intl.DateTimeFormat('en-PH', { weekday: 'long', hour: 'numeric', minute: '2-digit' }).format(new Date());
    };
    const timer = setInterval(tick, 15000);
    tick();
    return h(
      'section.lock-brand',
      h('div.hangul', { 'aria-hidden': 'true' }, h('span', '먹'), h('span.r', '어'), h('span', '봐')),
      h('img', { src: M.asset('logo.png'), alt: 'Mogoba Korean Food House logo', width: 88, height: 88 }),
      h('h1', 'Mogoba', h('br'), 'Korean Food House'),
      h('p', sub || 'Register, kitchen, stock and reports. Works with or without internet.'),
      clock
    );
  }

  /* ---------- first run ---------- */
  function mountSetup(el, onDone) {
    const card = h('div.lock-card.glass');
    U.mount(el, h('div.lock', brand('Set up this tablet as Mogoba’s register. Data stays on the device and works offline.'), h('section.lock-panel', card)));

    function choose() {
      U.mount(
        card,
        h('h2', 'Set up the register'),
        h('button.choice', { type: 'button', onclick: () => run(true) }, ui().icon('sparkle', 26), h('div', h('b', 'Explore with sample data'), h('span', 'Two weeks of made-up sales, stock and shifts. Remove it from Settings when ready.'))),
        h('button.choice', { type: 'button', onclick: owner }, ui().icon('pos', 26), h('div', h('b', 'Start Mogoba for real'), h('span', 'Mogoba’s full menu and recipes, stock at zero, and your own owner PIN.'))),
        h('p.hint', 'You can switch later in Settings.')
      );
    }
    function owner() {
      const name = h('input.input', { placeholder: 'Your name', 'aria-label': 'Owner name', maxlength: 30, autocomplete: 'off' });
      const pin = h('input.input', { type: 'password', inputmode: 'numeric', maxlength: 4, placeholder: '4-digit PIN', 'aria-label': 'PIN', autocomplete: 'new-password' });
      const pin2 = h('input.input', { type: 'password', inputmode: 'numeric', maxlength: 4, placeholder: 'Repeat PIN', 'aria-label': 'Repeat PIN', autocomplete: 'new-password' });
      U.mount(
        card,
        h('div.row-gap', h('button.icon-btn', { type: 'button', 'aria-label': 'Back', onclick: choose }, ui().icon('left')), h('h2', 'Owner account')),
        h('p.lead', { style: { margin: 0 } }, 'The owner PIN unlocks prices, staff, reports and backups. Add staff later in Settings.'),
        ui().field('Name', name),
        h('div.form-grid', ui().field('PIN', pin), ui().field('Repeat PIN', pin2)),
        h(
          'button.btn.primary.lg.block',
          {
            type: 'button',
            onclick: () => {
              if (!name.value.trim()) return ui().toast('Enter your name.', 'err');
              if (!/^\d{4}$/.test(pin.value)) return ui().toast('The PIN must be 4 digits.', 'err');
              if (pin.value !== pin2.value) return ui().toast('The two PINs do not match.', 'err');
              run(false, { name: name.value.trim(), pin: pin.value });
            },
          },
          'Create register'
        )
      );
      setTimeout(() => name.focus(), 50);
    }
    async function run(demo, ownerInfo) {
      const bar = h('i');
      U.mount(card, h('h2', demo ? 'Cooking up two weeks of sales…' : 'Setting up…'), h('div.progress', bar), h('p.hint', 'This takes a few seconds.'));
      try {
        await C.setup({ demo, owner: ownerInfo, onProgress: (p) => (bar.style.width = Math.round(p * 100) + '%') });
        bar.style.width = '100%';
        onDone();
      } catch (e) {
        console.error(e);
        ui().toast('Setup failed: ' + e.message, 'err', 6000);
        choose();
      }
    }
    choose();
  }

  /* ---------- sign in ---------- */
  function mountLock(el, onDone) {
    const card = h('div.lock-card.glass');
    U.mount(el, h('div.lock', brand(), h('section.lock-panel', card)));
    const users = S.users.filter((u) => u.active !== false);

    function pick() {
      U.mount(
        card,
        h('h2', 'Who’s on the register?'),
        h(
          'div.users',
          users.map((u) =>
            h(
              'button.user-card',
              { type: 'button', onclick: () => pin(u) },
              h('span.avatar.lg', { class: 'r-' + u.role }, u.name.slice(0, 1).toUpperCase()),
              h('span.nm', u.name),
              h('span.rl', C.ROLES[u.role])
            )
          )
        ),
        S.meta.demo ? h('p.hint', 'Sample PINs: Owner 1234 · Mark, manager 2580 · Joy, cashier 0000') : null
      );
    }
    function pin(u) {
      const err = h('p.err-text', { role: 'alert' });
      U.mount(
        card,
        h('div.row-gap', h('button.icon-btn', { type: 'button', 'aria-label': 'Back to staff list', onclick: pick }, ui().icon('left')), h('span.avatar', { class: 'r-' + u.role }, u.name.slice(0, 1).toUpperCase()), h('h2.grow', u.name)),
        h('p.hint', 'Enter your 4-digit PIN'),
        ui().pinPad(async (p) => {
          try {
            await C.login(u.id, p);
            onDone();
            return true;
          } catch (e) {
            err.textContent = e.message;
            return false;
          }
        }),
        err
      );
    }
    if (users.length === 1) pin(users[0]);
    else pick();
  }

  M.lock = { mountSetup, mountLock };
})((window.M = window.M || {}));

/* js/app.js */
/* Mogoba POS: app shell: boot, single-tab guard, navigation, top bar, auto-lock, day rollover. */
(function (M) {
  'use strict';
  const U = M.util;
  const C = M.core;
  const S = M.state;
  const h = U.h;
  const ui = () => M.ui;

  M.asset = (p) => (M.ASSETS && M.ASSETS[p]) || 'assets/' + p;

  const NAV = ['overview', 'register', 'orders', 'stock', 'drawer', 'reports', 'menu', 'settings'];
  const PHONE_TABS = ['register', 'orders', 'stock', 'drawer'];
  const App = (M.app = { route: null, cleanup: null, day: U.dayKey(), last: Date.now() });
  const root = () => document.getElementById('app');

  /* ---------- theme ---------- */
  const dark = matchMedia('(prefers-color-scheme: dark)');
  function applyTheme() {
    const t = (S.settings && S.settings.ui.theme) || 'dark';
    const mode = t === 'auto' ? (dark.matches ? 'dark' : 'light') : t;
    document.documentElement.dataset.theme = mode;
    document.documentElement.classList.toggle('lite', !!(S.settings && S.settings.ui.glass === 'lite'));
    const meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.content = mode === 'light' ? '#F1EBDF' : '#0E0D0C';
  }
  dark.addEventListener && dark.addEventListener('change', applyTheme);

  /* ---------- errors never leave the cashier stuck ---------- */
  addEventListener('error', (e) => {
    console.error(e.error || e.message);
    if (M.ui && e.message && !/ResizeObserver/.test(e.message)) M.ui.toast('Something went wrong: ' + e.message, 'err', 5000);
  });
  addEventListener('unhandledrejection', (e) => {
    console.error(e.reason);
    if (M.ui) M.ui.toast('Something went wrong: ' + ((e.reason && e.reason.message) || e.reason), 'err', 5000);
  });

  function fatal(title, text, action) {
    U.mount(root(), h('div.gate', h('div.gate-card.glass', h('div.empty-mark', '먹어봐'), h('h2', title), h('p.lead', { style: { margin: 0 } }, text), action || null)));
  }

  /* ---------- one register per device: two tabs would double-count stock ---------- */
  /* Where the lock API is missing or refused (some embedded frames), run without the guard. */
  function singleTab() {
    if (!navigator.locks || !navigator.locks.request) return Promise.resolve(true);
    return new Promise((res) => {
      let settled = false;
      const done = (v) => {
        if (!settled) {
          settled = true;
          res(v);
        }
      };
      try {
        navigator.locks
          .request('mogoba-pos-register', { ifAvailable: true }, (lock) => {
            done(!!lock);
            return lock ? new Promise(() => {}) : null;
          })
          .catch((e) => {
            if (!settled) return done(true);
            if (e && e.name === 'AbortError') {
              M.ui.closeAll();
              fatal('Opened somewhere else', 'Mogoba POS is open in another tab. This one stopped so stock and cash stay exact.', h('button.btn.primary.lg.block', { type: 'button', onclick: () => location.reload() }, 'Use it here instead'));
            }
          });
      } catch (e) {
        done(true);
      }
    });
  }
  function steal() {
    try {
      navigator.locks.request('mogoba-pos-register', { steal: true }, () => new Promise(() => {})).catch(() => {});
    } catch (e) {
      /* lock API refused: carry on without it */
    }
    setTimeout(start, 50);
  }

  /* ---------- boot ---------- */
  async function boot() {
    applyTheme();
    const mine = await singleTab();
    if (!mine) {
      fatal('Already open in another tab', 'Use one tab per tablet so stock and cash stay exact.', h('button.btn.primary.lg.block', { type: 'button', onclick: steal }, 'Use it here instead'));
      return;
    }
    start();
  }

  async function start() {
    let ready;
    try {
      ready = await C.load();
    } catch (e) {
      console.error(e);
      fatal('The register cannot open its storage', e.message + ' Close other Mogoba tabs and reload. If you are in a private window, use a normal one.', h('button.btn.primary.lg.block', { type: 'button', onclick: () => location.reload() }, 'Reload'));
      return;
    }
    M.db.persist();
    M.bus.on('db:closed', () => fatal('Storage was closed', 'Another version of the app took over storage. Reload to continue.', h('button.btn.primary.lg.block', { type: 'button', onclick: () => location.reload() }, 'Reload')));
    if (!ready) return M.lock.mountSetup(root(), afterSetup);
    applyTheme();
    showLock();
  }

  function afterSetup() {
    applyTheme();
    showLock();
  }

  function showLock() {
    ui().closeAll();
    if (App.cleanup) App.cleanup();
    App.cleanup = null;
    App.route = null;
    M.lock.mountLock(root(), enter);
  }

  /* ---------- shell ---------- */
  let shell = null;
  async function enter() {
    App.last = Date.now();
    await computePopular();
    const rail = h('nav.rail.glass', { 'aria-label': 'Main' });
    const tabbar = h('nav.tabbar', { 'aria-label': 'Main' });
    const topbar = h('header.topbar.glass');
    const view = h('div.view');
    U.mount(root(), h('div.shell', rail, h('div.main', topbar, view)), tabbar);
    shell = { rail, tabbar, topbar, view };
    drawNav();
    drawTop();
    M.sync.start();
    if (M.online) M.online.start();
    go('register', true);
    if (!S.meta.demo && C.can('*') && Date.now() - (S.meta.lastBackup || 0) > 3 * 864e5) {
      setTimeout(() => ui().toast(S.meta.lastBackup ? 'Last backup was ' + U.ago(S.meta.lastBackup) + '. Settings → Download backup.' : 'No backup yet. Settings → Download backup.', 'err', 6000), 800);
    }
  }

  const allowed = (r) => C.can(M.views[r].perm);

  function badgeFor(r) {
    if (r === 'orders') {
      const n = S.today.filter((o) => o.status === 'paid' && o.kitchen && o.kitchen !== 'done').length + (M.online ? M.online.pendingCount() : 0);
      return n ? String(n) : '';
    }
    if (r === 'stock') {
      const n = Object.values(S.ings).filter((i) => i.active !== false && M.logic.stockStatus(i) === 'out').length;
      return n ? String(n) : '';
    }
    return '';
  }

  function drawNav() {
    if (!shell) return;
    const routes = NAV.filter(allowed);
    U.mount(
      shell.rail,
      h('img.logo', { src: M.asset('logo.png'), alt: 'Mogoba' }),
      routes.map((r) => {
        const b = badgeFor(r);
        return h('button.rail-btn', { type: 'button', 'aria-current': App.route === r ? 'page' : null, onclick: () => go(r) }, ui().icon(M.views[r].icon, 24), M.views[r].title, b ? h('span.dot', b) : null);
      }),
      h('div.spacer'),
      h('button.rail-btn', { type: 'button', onclick: lockNow }, ui().icon('lock', 24), 'Lock')
    );
    const tabs = PHONE_TABS.filter(allowed);
    U.mount(
      shell.tabbar,
      tabs.map((r) => {
        const b = badgeFor(r);
        return h('button', { type: 'button', 'aria-current': App.route === r ? 'page' : null, onclick: () => go(r) }, ui().icon(M.views[r].icon, 22), M.views[r].title, b ? h('span.dot', b) : null);
      }),
      h('button', { type: 'button', 'aria-current': !tabs.includes(App.route) && App.route ? 'page' : null, onclick: moreSheet }, ui().icon('grid', 22), 'More')
    );
    shell.tabbar.style.gridTemplateColumns = 'repeat(' + (tabs.length + 1) + ', 1fr)';
  }

  function moreSheet() {
    const s = ui().sheet({ title: 'More', cls: 'narrow' });
    const extra = NAV.filter((r) => !PHONE_TABS.includes(r) && allowed(r));
    s.setBody(
      h(
        'div.list',
        extra.map((r) => h('button.row', { type: 'button', onclick: () => (s.close(), go(r)) }, ui().icon(M.views[r].icon), h('div.grow.t', M.views[r].title), ui().icon('right', 18))),
        h('button.row', { type: 'button', onclick: () => (s.close(), lockNow()) }, ui().icon('lock'), h('div.grow.t', 'Lock / switch staff'))
      )
    );
  }

  function syncPill() {
    const st = M.sync.status;
    const map = { demo: ['', 'Sample data', 'sparkle'], local: ['', 'On this device', 'device'], offline: ['warn', 'Offline · ' + st.pending + ' queued', 'cloudOff'], syncing: ['ok', 'Syncing…', 'cloud'], error: ['bad', 'Sync retrying', 'cloudOff'], pending: ['warn', st.pending + ' to sync', 'cloud'], ok: ['ok', 'Synced', 'cloud'] };
    const [cls, txt, icon] = map[st.state] || map.local;
    /* On a phone the bar only shows sync when it needs attention. */
    const quiet = ['demo', 'local', 'ok', 'syncing'].includes(st.state) ? ' quiet' : '';
    return h('button.pill', { type: 'button', class: cls + quiet, title: txt, 'aria-label': 'Sync status: ' + txt, onclick: () => (C.can('*') ? go('settings') : ui().toast(txt)) }, h('i'), ui().icon(icon, 16), h('span.txt', txt));
  }

  function drawTop() {
    if (!shell) return;
    const v = App.route && M.views[App.route];
    const sh = S.shift;
    U.mount(
      shell.topbar,
      h('div.brand', h('img', { src: M.asset('logo.png'), alt: '' })),
      h('h1', v ? v.title : ''),
      h('span.shift-chip', sh ? 'Shift open since ' + U.fmtTime(sh.openedAt) : 'No open shift'),
      h('div.grow'),
      M.online && M.online.pendingCount() ? h('button.pill.bad.alert-pill', { type: 'button', 'aria-label': M.online.pendingCount() + ' online orders to confirm', onclick: () => M.online.inbox() }, ui().icon('orders', 16), h('b', String(M.online.pendingCount())), h('span.txt', 'online ' + (M.online.pendingCount() === 1 ? 'order' : 'orders'))) : null,
      syncPill(),
      h('button.user-btn', { type: 'button', 'aria-label': 'Signed in as ' + S.user.name + '. Open staff menu', onclick: userMenu }, h('span.avatar', { class: 'r-' + S.user.role }, S.user.name.slice(0, 1).toUpperCase()), h('span.nm', S.user.name))
    );
  }

  function userMenu() {
    const s = ui().sheet({ title: S.user.name + ' · ' + C.ROLES[S.user.role], cls: 'narrow', icon: 'user' });
    const row = (icon, t, fn) => h('button.row', { type: 'button', onclick: () => (s.close(), fn()) }, ui().icon(icon), h('div.grow.t', t), ui().icon('right', 18));
    s.setBody(
      h(
        'div.list',
        S.shift ? row('drawer', 'Drawer & shift', () => go('drawer')) : row('drawer', 'Open shift', () => M.drawerView.openShiftFlow()),
        row('settings', 'Settings', () => go('settings')),
        row('lock', 'Lock / switch staff', lockNow)
      )
    );
  }

  function lockNow() {
    C.persistCart();
    C.logout();
    showLock();
  }

  function go(r, replace) {
    if (!M.views[r]) r = 'register';
    if (!allowed(r)) {
      ui().toast('Your role cannot open ' + M.views[r].title + '. Ask a manager.', 'err');
      if (App.route) return;
      r = 'register';
    }
    const hash = '#/' + r;
    if (location.hash !== hash) {
      try {
        if (replace) history.replaceState(null, '', hash);
        else history.pushState(null, '', hash);
      } catch (e) {
        /* history is locked in some embedded frames; navigation still works without it */
      }
    }
    render(r);
  }
  addEventListener('popstate', () => {
    if (!shell || !S.user) return;
    const r = (location.hash.match(/^#\/(\w+)/) || [])[1];
    if (r && r !== App.route && M.views[r]) render(allowed(r) ? r : 'register');
  });

  function render(r) {
    if (App.cleanup) App.cleanup();
    App.cleanup = null;
    App.route = r;
    shell.view.scrollTop = 0;
    try {
      App.cleanup = M.views[r].mount(shell.view) || null;
    } catch (e) {
      console.error(e);
      U.mount(shell.view, ui().empty('This screen hit a problem', e.message));
    }
    drawNav();
    drawTop();
  }

  async function computePopular() {
    try {
      const to = U.dayKey();
      const orders = await C.ordersBetween(U.addDays(to, -13), to);
      const n = {};
      for (const o of orders) if (o.status === 'paid') for (const l of o.lines) if (l.itemId) n[l.itemId] = (n[l.itemId] || 0) + l.qty;
      S.popular = Object.keys(n)
        .filter((id) => S.items[id] && S.items[id].active !== false && S.items[id].cat !== 'addons')
        .sort((a, b) => n[b] - n[a])
        .slice(0, 12);
      M.bus.emit('menu');
    } catch (e) {
      console.error(e);
    }
  }

  /* ---------- background duties ---------- */
  ['pointerdown', 'keydown'].forEach((ev) => addEventListener(ev, () => (App.last = Date.now()), { passive: true, capture: true }));
  setInterval(async () => {
    if (!S.user || !S.settings) return;
    const min = S.settings.sales.autoLockMin;
    if (min > 0 && Date.now() - App.last > min * 60000 && !document.querySelector('.sheet')) lockNow();
    const d = U.dayKey();
    if (d !== App.day) {
      App.day = d;
      await C.refreshToday();
      computePopular();
      M.bus.emit('change');
    }
  }, 15000);
  M.bus.on('change', () => {
    drawNav();
    drawTop();
  });
  M.bus.on('sync', drawTop);
  M.bus.on('settings', () => {
    applyTheme();
    drawTop();
  });
  M.bus.on('stock', drawNav);
  M.bus.on('online', () => {
    drawNav();
    drawTop();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') C.persistCart();
  });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor && !M.ASSETS) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Offline cache unavailable:', e.message)));
  }

  M.app.go = go;
  M.app.lockNow = lockNow;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})((window.M = window.M || {}));

</script>
