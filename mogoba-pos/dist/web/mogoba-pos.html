    const counted = L.countTotal(counts);
    const d = drawer(ctx.shift);
    const zNo = (ctx.meta.zSeq || 0) + 1;
    const t = ctx.shift.tot || emptyTot();
    const w = {};
    for (const k in wallets || {}) {
      if (!(wallets[k] >= 0)) continue;
      const expected = (t.sales[k] || 0) - (t.refunds[k] || 0);
      w[k] = { expected, counted: wallets[k], diff: wallets[k] - expected };
    }
    const shift = Object.assign({}, ctx.shift, { status: 'closed', closedAt: at, closedBy: who(ctx.user), counts, counted, expected: d.expected, overShort: counted - d.expected, wallets: w, note: note || '', zNo });
    return { shift, meta: Object.assign({}, ctx.meta, { zSeq: zNo }) };
  }

  function buildCash(ctx, type, amount, reason, approver, at) {
    if (!ctx.shift) throw new Error('Open a shift first.');
    if (!(amount > 0)) throw new Error('Enter an amount greater than zero.');
    const entry = { id: U.uid(), shiftId: ctx.shift.id, type, amount, reason, at, by: who(ctx.user), approver: who(approver) };
    const shift = bumpShift(ctx.shift, (t) => {
      if (type === 'in') t.ins += amount;
      else t.outs += amount;
    });
    return { entry, shift };
  }

  /* ---------------- live context & commit ---------------- */

  function ctx() {
    return { settings: S.settings, meta: S.meta, shift: S.shift, user: S.user, ings: S.ings, menu: menu() };
  }

  function outbox(t, kind, data, at) {
    t.add('outbox', { eid: U.uid(), kind, at: at || Date.now(), device: S.meta.deviceId, data });
  }

  function audit(t, action, detail, approver) {
    t.put('audit', { id: U.uid(), at: Date.now(), by: who(S.user), approver: who(approver), action, detail: detail || '' });
  }

  async function commit(stores, fn) {
    const all = Array.from(new Set(stores.concat(['outbox', 'audit'])));
    const after = await DB.write(all, fn);
    if (typeof after === 'function') after();
    M.bus.emit('change');
    if (M.sync) M.sync.kick();
  }

  function applyIngs(map) {
    for (const k in map) S.ings[k] = map[k];
  }

  function upsertToday(o) {
    if (o.day !== U.dayKey()) return;
    const i = S.today.findIndex((x) => x.id === o.id);
    if (i >= 0) S.today[i] = o;
    else S.today.push(o);
  }

  /* ---------------- boot & setup ---------------- */

  async function load() {
    await DB.open();
    const kv = {};
    for (const row of await DB.all('kv')) kv[row.k] = row.v;
    S.settings = kv.settings || null;
    S.meta = kv.meta || null;
    if (!S.meta || !S.settings) return false;
    const defaults = M.seed.SETTINGS();
    for (const k in defaults) S.settings[k] = Object.assign({}, defaults[k], S.settings[k] || {});
    S.users = (await DB.all('users')).sort((a, b) => (a.sort || 0) - (b.sort || 0));
    S.cats = (await DB.all('cats')).sort((a, b) => a.sort - b.sort);
    S.items = {};
    for (const it of await DB.all('items')) S.items[it.id] = it;
    S.mods = {};
    for (const m of await DB.all('mods')) S.mods[m.id] = m;
    S.ings = {};
    for (const i of await DB.all('ings')) S.ings[i.id] = i;
    S.shift = (await DB.byIndex('shifts', 'status', 'open'))[0] || null;
    S.open = (await DB.byIndex('orders', 'status', 'open')).sort((a, b) => a.createdAt - b.createdAt);
    S.today = await DB.byIndex('orders', 'day', U.dayKey());
    S.lastType = kv.lastType || 'dine';
    S.cart = kv.draft && kv.draft.lines ? kv.draft : newCart();
    S.ready = true;
    return true;
  }

  /* Day rolled over while the app stayed open (it happens with all-day tablets). */
  async function refreshToday() {
    S.today = await DB.byIndex('orders', 'day', U.dayKey());
  }

  function makeUser(name, role, pin, sort) {
    const salt = U.randHex(8);
    return { id: U.uid(), name, role, salt, pin: U.hashPin(pin, salt), active: true, sort: sort || 0, createdAt: Date.now() };
  }

  async function setup(opts) {
    const now = Date.now();
    const meta = { deviceId: U.uid(), seq: 0, zSeq: 0, queueDay: '', queueN: 0, demo: !!opts.demo, createdAt: now, lastBackup: 0, schema: 1 };
    const settings = M.seed.SETTINGS();
    settings.online.enabled = !!opts.demo;
    if (opts.demo) {
      const pay = settings.online.payments;
      pay.gcash = Object.assign({}, pay.gcash, { accountName: 'Mogoba Korean Food House', number: '0917 000 0000', qr: M.demo.sampleQr('gcash', '#0A5BD8') });
      pay.maya = Object.assign({}, pay.maya, { accountName: 'Mogoba Korean Food House', number: '0917 000 0000', qr: M.demo.sampleQr('maya', '#0B8A4C') });
    }
    const users = opts.demo
      ? [makeUser('Owner', 'owner', '1234', 0), makeUser('Mark', 'manager', '2580', 1), makeUser('Joy', 'cashier', '0000', 2)]
      : [makeUser(opts.owner.name, 'owner', opts.owner.pin, 0)];
    const clone = (x) => JSON.parse(JSON.stringify(x));
    const items = clone(M.seed.items);
    const ings = M.seed.ingredients(false);
    await DB.wipe();
    await DB.write(DB.STORES, (t) => {
      t.put('kv', { k: 'meta', v: meta });
      t.put('kv', { k: 'settings', v: settings });
      for (const u of users) t.put('users', u);
      for (const c of M.seed.CATS) t.put('cats', c);
      for (const it of items) t.put('items', it);
      for (const m of clone(M.seed.MODS)) t.put('mods', m);
      for (const i of ings) t.put('ings', i);
    });
    await load();
    if (opts.demo && M.demo) await M.demo.generate(opts.onProgress);
    await load();
  }

  /* ---------------- auth ---------------- */

  const fails = { n: 0, until: 0 };
  function checkPin(user, pin) {
    return !!user && user.active && U.hashPin(pin, user.salt) === user.pin;
  }
  async function login(userId, pin) {
    if (Date.now() < fails.until) throw new Error('Too many wrong PINs. Wait ' + Math.ceil((fails.until - Date.now()) / 1000) + ' s.');
    const u = S.users.find((x) => x.id === userId);
    if (!checkPin(u, pin)) {
      fails.n++;
      if (fails.n >= 5) {
        fails.until = Date.now() + 30000;
        fails.n = 0;
      }
      throw new Error('Wrong PIN.');
    }
    fails.n = 0;
    S.user = u;
    await DB.write(['audit'], (t) => audit(t, 'login', u.name));
    M.bus.emit('auth');
    return u;
  }
  /* Approver PIN: any active user with the permission. */
  function approverByPin(pin, perm) {
    if (Date.now() < fails.until) throw new Error('Too many wrong PINs. Wait ' + Math.ceil((fails.until - Date.now()) / 1000) + ' s.');
    const u = S.users.find((x) => x.active && can(perm, x) && checkPin(x, pin));
    if (!u) {
      fails.n++;
      if (fails.n >= 5) {
        fails.until = Date.now() + 30000;
        fails.n = 0;
      }
      throw new Error('That PIN cannot approve this.');
    }
    fails.n = 0;
    return u;
  }
  function logout() {
    S.user = null;
    M.bus.emit('auth');
  }

  /* ---------------- cart ---------------- */

  function newCart() {
    return { id: U.uid(), status: 'open', held: false, type: S.lastType || 'dine', table: '', customer: '', channel: '', lines: [], disc: null, payments: [], refunds: [], createdAt: Date.now(), rev: 0 };
  }

  const saveCart = U.debounce(() => persistCart(), 250);
  function persistCart() {
    const c = S.cart;
    if (!c || !S.ready) return Promise.resolve();
    if (c.held) return DB.write(['orders'], (t) => t.put('orders', c)).catch((e) => console.error(e));
    return DB.write(['kv'], (t) => t.put('kv', { k: 'draft', v: c })).catch((e) => console.error(e));
  }
  function cartChanged() {
    S.cart.updatedAt = Date.now();
    saveCart();
    M.bus.emit('cart');
  }

  function cartTotals() {
    return L.totals(S.cart, { vat: !!S.settings.business.vat });
  }

  function addLine(item, variant, mods, qty, note) {
    const unit = (variant ? variant.price : item.price) + (mods || []).reduce((s, m) => s + m.price, 0);
    const line = {
      id: U.uid(),
      itemId: item.id,
      name: item.name,
      cat: item.cat,
      variantId: variant ? variant.id : '',
      variantName: variant ? variant.name : '',
      mods: (mods || []).map((m) => ({ gid: m.gid, oid: m.oid, name: m.name, price: m.price })),
      unit,
      qty: qty || 1,
      note: note || '',
      sent: false,
    };
    const key = L.lineKey(line);
    const same = S.cart.lines.find((l) => !l.sent && !l.disc && L.lineKey(l) === key);
    if (same) same.qty += line.qty;
    else S.cart.lines.push(line);
    cartChanged();
    return same || line;
  }

  /* More of a line the kitchen already has: a new, unsent line so the kitchen sees the extra. */
  function addMore(lineId, qty) {
    const l = findLine(lineId);
    if (!l || !(qty > 0)) return;
    S.cart.lines.push(Object.assign({}, l, { id: U.uid(), qty, sent: false, disc: null }));
    cartChanged();
  }

  function addCustom(name, unit, qty) {
    const line = { id: U.uid(), itemId: null, name: name || 'Custom item', cat: 'custom', variantId: '', variantName: '', mods: [], unit, qty: qty || 1, note: '', sent: false };
    S.cart.lines.push(line);
    cartChanged();
    return line;
  }

  function findLine(id) {
    return S.cart.lines.find((l) => l.id === id);
  }

  function setQty(lineId, qty) {
    const l = findLine(lineId);
    if (!l) return;
    if (qty <= 0) S.cart.lines = S.cart.lines.filter((x) => x.id !== lineId);
    else l.qty = qty;
    cartChanged();
  }

  function patchLine(lineId, patch) {
    const l = findLine(lineId);
    if (!l) return;
    Object.assign(l, patch);
    cartChanged();
  }

  /* Taking back something the kitchen already started is logged; the food can be wasted. */
  async function removeSent(lineId, qty, approver, reason, wasted) {
    const l = findLine(lineId);
    if (!l) return;
    const take = Math.min(qty, l.qty);
    const at = Date.now();
    let st = { moves: [], ings: {} };
    if (wasted) {
      const use = L.unitRecipe(l, menu());
      for (const k in use) use[k] *= take;
      st = stockMoves(ctx(), use, -1, 'waste', S.cart.id, at, 'Voided after kitchen: ' + reason);
    }
    if (take >= l.qty) S.cart.lines = S.cart.lines.filter((x) => x.id !== lineId);
    else l.qty -= take;
    S.cart.updatedAt = at;
    const cart = S.cart;
    await commit(['orders', 'moves', 'ings'], (t) => {
      if (cart.held) t.put('orders', cart);
      for (const m of st.moves) t.put('moves', m);
      for (const k in st.ings) t.put('ings', st.ings[k]);
      audit(t, 'line.void', take + ' × ' + l.name + (l.variantName ? ' (' + l.variantName + ')' : '') + ': ' + reason + (wasted ? ' · wasted' : ''), approver);
      if (st.moves.length) outbox(t, 'stock.moves', { moves: st.moves }, at);
      return () => applyIngs(st.ings);
    });
    M.bus.emit('cart');
  }

  function setCart(patch) {
    Object.assign(S.cart, patch);
    if (patch.type) {
      S.lastType = patch.type;
      DB.write(['kv'], (t) => t.put('kv', { k: 'lastType', v: patch.type })).catch(() => {});
    }
    cartChanged();
  }

  async function clearCart(approver) {
    const c = S.cart;
    const sent = c.lines.some((l) => l.sent);
    if (c.held) {
      await commit(['orders'], (t) => {
        t.del('orders', c.id);
        audit(t, 'ticket.delete', (c.table || c.customer || 'Ticket') + ' · ' + c.lines.length + ' lines', approver);
        return () => {
          S.open = S.open.filter((o) => o.id !== c.id);
        };
      });
    } else if (sent) {
      await commit([], (t) => audit(t, 'ticket.clear', c.lines.length + ' lines', approver));
    }
    S.cart = newCart();
    await DB.write(['kv'], (t) => t.del('kv', 'draft'));
    M.bus.emit('cart');
  }

  async function holdCart() {
    const c = S.cart;
    if (!c.lines.length) throw new Error('Add items before holding the ticket.');
    for (const l of c.lines) l.sent = true;
    c.held = true;
    c.heldAt = c.heldAt || Date.now();
    c.updatedAt = Date.now();
    await commit(['orders', 'kv'], (t) => {
      t.put('orders', c);
      t.del('kv', 'draft');
      return () => {
        if (!S.open.find((o) => o.id === c.id)) S.open.push(c);
      };
    });
    S.cart = newCart();
    M.bus.emit('cart');
    return c;
  }

  async function resume(id) {
    const o = S.open.find((x) => x.id === id);
    if (!o) return;
    if (S.cart.lines.length && S.cart.id !== o.id) await holdCart();
    if (!S.cart.held) await DB.write(['kv'], (t) => t.del('kv', 'draft'));
    S.cart = o;
    M.bus.emit('cart');
  }

  /* ---------------- sales ---------------- */

  async function completeSale(payments) {
    const at = Date.now();
    const cart = S.cart;
    const b = buildSale(ctx(), cart, payments, at);
    await commit(['orders', 'moves', 'ings', 'kv', 'shifts'], (t) => {
      t.put('orders', b.order);
      for (const m of b.moves) t.put('moves', m);
      for (const k in b.ings) t.put('ings', b.ings[k]);
      t.put('kv', { k: 'meta', v: b.meta });
      t.put('shifts', b.shift);
      t.del('kv', 'draft');
      outbox(t, 'order.paid', { order: b.order, moves: b.moves }, at);
      if (b.order.disc) audit(t, 'discount', b.order.no + ' · ' + discLabel(b.order.disc) + ' · ' + U.peso(b.order.totals.discountTotal), b.order.disc.approver);
      return () => {
        S.meta = b.meta;
        S.shift = b.shift;
        applyIngs(b.ings);
        S.open = S.open.filter((o) => o.id !== b.order.id);
        upsertToday(b.order);
        S.cart = newCart();
      };
    });
    M.bus.emit('cart');
    return b.order;
  }

  /* A sale that did not come from the cashier's cart (online orders). The current cart is untouched. */
  async function recordSale(cart, payments) {
    const at = Date.now();
    const b = buildSale(ctx(), Object.assign(newCart(), cart), payments, at);
    await commit(['orders', 'moves', 'ings', 'kv', 'shifts'], (t) => {
      t.put('orders', b.order);
      for (const m of b.moves) t.put('moves', m);
      for (const k in b.ings) t.put('ings', b.ings[k]);
      t.put('kv', { k: 'meta', v: b.meta });
      t.put('shifts', b.shift);
      outbox(t, 'order.paid', { order: b.order, moves: b.moves }, at);
      audit(t, 'online.paid', (cart.onlineCode || '') + ' · ' + U.peso(b.order.totals.total));
      return () => {
        S.meta = b.meta;
        S.shift = b.shift;
        applyIngs(b.ings);
        upsertToday(b.order);
      };
    });
    return b.order;
  }

  /* An open ticket waiting for payment at pickup (cash online orders). */
  async function createTicket(cart) {
    const c = Object.assign(newCart(), cart, { held: true, heldAt: Date.now(), updatedAt: Date.now() });
    await commit(['orders'], (t) => {
      t.put('orders', c);
      audit(t, 'online.ticket', (cart.onlineCode || '') + ' · ' + c.lines.length + ' lines');
      return () => {
        if (!S.open.find((o) => o.id === c.id)) S.open.push(c);
      };
    });
    M.bus.emit('cart');
    return c;
  }

  async function voidOrder(order, opts) {
    const at = Date.now();
    const b = buildVoid(ctx(), order, opts, at);
    await commit(['orders', 'moves', 'ings', 'shifts'], (t) => {
      t.put('orders', b.order);
      for (const m of b.moves) t.put('moves', m);
      for (const k in b.ings) t.put('ings', b.ings[k]);
      t.put('shifts', b.shift);
      outbox(t, 'order.voided', { order: b.order, moves: b.moves }, at);
      audit(t, 'void', order.no + ' · ' + U.peso(L.orderNet(order)) + ' · ' + opts.reason + (opts.restock ? ' · restocked' : ' · not restocked'), opts.approver);
      return () => {
        S.shift = b.shift;
        applyIngs(b.ings);
        upsertToday(b.order);
      };
    });
    return b.order;
  }

  async function refundOrder(order, opts) {
    const at = Date.now();
    const b = buildRefund(ctx(), order, opts, at);
    await commit(['orders', 'moves', 'ings', 'shifts'], (t) => {
      t.put('orders', b.order);
      for (const m of b.moves) t.put('moves', m);
      for (const k in b.ings) t.put('ings', b.ings[k]);
      t.put('shifts', b.shift);
      outbox(t, 'order.refunded', { order: b.order, refund: b.refund, moves: b.moves }, at);
      audit(t, 'refund', order.no + ' · ' + U.peso(b.refund.amount) + ' · ' + opts.reason, opts.approver);
      return () => {
        S.shift = b.shift;
        applyIngs(b.ings);
        upsertToday(b.order);
      };
    });
    return b;
  }

  async function setKitchen(order, status) {
    const o = Object.assign({}, order, { kitchen: status, rev: (order.rev || 0) + 1, updatedAt: Date.now() });
    await commit(['orders'], (t) => {
      t.put('orders', o);
      outbox(t, 'order.kitchen', { id: o.id, kitchen: status, rev: o.rev });
      return () => upsertToday(o);
    });
    return o;
  }

  function discLabel(d) {
    if (!d) return '';
    if (d.kind === 'scpwd') return 'SC/PWD ' + d.count + ' of ' + d.diners;
    if (d.kind === 'pct') return d.value + '% ' + (d.reason || '');
    return U.peso(d.value) + ' off ' + (d.reason || '');
  }

  /* ---------------- shifts & cash ---------------- */

  async function openShift(float) {
    if (S.shift) throw new Error('A shift is already open.');
    const sh = buildOpenShift(ctx(), float, Date.now());
    await commit(['shifts'], (t) => {
      t.put('shifts', sh);
      outbox(t, 'shift.opened', { shift: sh });
      audit(t, 'shift.open', 'Float ' + U.peso(float));
      return () => {
        S.shift = sh;
      };
    });
    return sh;
  }

  async function cashMove(type, amount, reason, approver) {
    const b = buildCash(ctx(), type, amount, reason, approver, Date.now());
    await commit(['cash', 'shifts'], (t) => {
      t.put('cash', b.entry);
      t.put('shifts', b.shift);
      outbox(t, 'cash.' + type, { entry: b.entry });
      audit(t, 'cash.' + type, U.peso(amount) + ' · ' + reason, approver);
      return () => {
        S.shift = b.shift;
      };
    });
    return b.entry;
  }

  async function closeShift(counts, note, wallets) {
    const b = buildCloseShift(ctx(), counts, note, Date.now(), wallets);
    await commit(['shifts', 'kv'], (t) => {
      t.put('shifts', b.shift);
      t.put('kv', { k: 'meta', v: b.meta });
      outbox(t, 'shift.closed', { shift: b.shift });
      audit(t, 'shift.close', 'Z' + b.shift.zNo + ' · counted ' + U.peso(b.shift.counted) + ' · ' + (b.shift.overShort === 0 ? 'balanced' : (b.shift.overShort > 0 ? 'over ' : 'short ') + U.peso(Math.abs(b.shift.overShort))));
      return () => {
        S.shift = null;
        S.meta = b.meta;
      };
    });
    return b.shift;
  }

  /* ---------------- stock ---------------- */

  async function stockOp(kind, b, detail) {
    await commit(['moves', 'ings', 'counts'], (t) => {
      for (const m of b.moves) t.put('moves', m);
      for (const k in b.ings) t.put('ings', b.ings[k]);
      if (b.count) t.put('counts', b.count);
      outbox(t, 'stock.' + kind, { moves: b.moves, count: b.count || null });
      audit(t, 'stock.' + kind, detail);
      return () => applyIngs(b.ings);
    });
    M.bus.emit('stock');
    return b;
  }
  const receive = (rows, note) => stockOp('receive', buildReceive(ctx(), rows, note || {}, Date.now()), rows.length + ' items' + (note && note.supplier ? ' from ' + note.supplier : ''));
  const waste = (rows, reason) => stockOp('waste', buildWaste(ctx(), rows, reason, Date.now()), rows.length + ' items · ' + reason);
  const count = (rows, note) => stockOp('count', buildCount(ctx(), rows, note, Date.now()), rows.length + ' items counted');
  const adjust = (rows, reason) => stockOp('adjust', buildAdjust(ctx(), rows, reason, Date.now()), rows.map((r) => (r.qty > 0 ? '+' : '') + U.trim(r.qty) + ' ' + (S.ings[r.ing] ? S.ings[r.ing].name : r.ing)).join(', ') + ' · ' + reason);

  async function saveIngredient(ing) {
    const isNew = !ing.id;
    const rec = Object.assign({ onHand: 0, cost: 0, par: 0, reorder: 0, active: true, sort: Object.keys(S.ings).length }, ing, { id: ing.id || U.uid(), updatedAt: Date.now() });
    if (!isNew) {
      rec.onHand = S.ings[rec.id].onHand;
      rec.lots = S.ings[rec.id].lots;
    }
    await commit(['ings'], (t) => {
      t.put('ings', rec);
      outbox(t, 'ingredient.saved', { ing: rec });
      audit(t, isNew ? 'ingredient.add' : 'ingredient.edit', rec.name);
      return () => {
        S.ings[rec.id] = rec;
      };
    });
    M.bus.emit('stock');
    return rec;
  }

  function usedIn(ingId) {
    const out = [];
    for (const it of Object.values(S.items)) {
      const rows = (it.recipe || []).concat(...(it.variants || []).map((v) => v.recipe || []));
      if (rows.some((r) => r.ing === ingId)) out.push(it);
    }
    for (const g of Object.values(S.mods)) for (const o of g.options) if ((o.recipe || []).some((r) => r.ing === ingId)) out.push({ id: g.id + ':' + o.id, name: g.name + ': ' + o.name });
    return out;
  }

  /* ---------------- menu ---------------- */

  async function saveItem(item) {
    const isNew = !item.id;
    const rec = Object.assign({ variants: null, addons: [], recipe: [], img: '', ko: '', active: true, sort: Object.keys(S.items).length }, item, { id: item.id || U.uid(), updatedAt: Date.now() });
    await commit(['items'], (t) => {
      t.put('items', rec);
      outbox(t, 'item.saved', { item: rec });
      audit(t, isNew ? 'menu.add' : 'menu.edit', rec.name);
      return () => {
        S.items[rec.id] = rec;
      };
    });
    M.bus.emit('menu');
    return rec;
  }

  async function saveCat(cat) {
    const rec = Object.assign({ tone: 'gold', kind: 'food', sort: S.cats.length }, cat, { id: cat.id || U.uid(), updatedAt: Date.now() });
    await commit(['cats'], (t) => {
      t.put('cats', rec);
      outbox(t, 'cat.saved', { cat: rec });
      audit(t, 'menu.category', rec.name);
      return () => {
        const i = S.cats.findIndex((c) => c.id === rec.id);
        if (i >= 0) S.cats[i] = rec;
        else S.cats.push(rec);
        S.cats.sort((a, b) => a.sort - b.sort);
      };
    });
    M.bus.emit('menu');
    return rec;
  }

  /* ---------------- people & settings ---------------- */

  async function saveUser(data) {
    let rec;
    if (data.id) {
      const cur = S.users.find((u) => u.id === data.id);
      rec = Object.assign({}, cur, { name: data.name, role: data.role, active: data.active !== false });
      if (data.pin) {
        rec.salt = U.randHex(8);
        rec.pin = U.hashPin(data.pin, rec.salt);
      }
      const owners = S.users.filter((u) => u.role === 'owner' && u.active && u.id !== rec.id);
      if (!owners.length && (rec.role !== 'owner' || !rec.active)) throw new Error('Keep at least one active owner.');
    } else {
      if (!data.pin) throw new Error('Set a 4-digit PIN.');
      rec = makeUser(data.name, data.role, data.pin, S.users.length);
    }
    if (!rec.name.trim()) throw new Error('Enter a name.');
    const clash = S.users.find((u) => u.id !== rec.id && u.active && data.pin && checkPin(u, data.pin));
    if (clash) throw new Error('That PIN is already used by ' + clash.name + '. Pick another.');
    await commit(['users'], (t) => {
      t.put('users', rec);
      audit(t, data.id ? 'user.edit' : 'user.add', rec.name + ' · ' + ROLES[rec.role]);
      return () => {
        const i = S.users.findIndex((u) => u.id === rec.id);
        if (i >= 0) S.users[i] = rec;
        else S.users.push(rec);
        if (S.user && S.user.id === rec.id) S.user = rec;
      };
    });
    return rec;
  }

  async function saveSettings(patch) {
    const next = JSON.parse(JSON.stringify(S.settings));
    for (const k in patch) next[k] = Object.assign({}, next[k], patch[k]);
    await commit(['kv'], (t) => {
      t.put('kv', { k: 'settings', v: next });
      audit(t, 'settings', Object.keys(patch).join(', '));
      return () => {
        S.settings = next;
      };
    });
    M.bus.emit('settings');
  }

  async function saveMeta(patch) {
    const next = Object.assign({}, S.meta, patch);
    await DB.write(['kv'], (t) => t.put('kv', { k: 'meta', v: next }));
    S.meta = next;
  }

  /* ---------------- queries ---------------- */

  async function ordersBetween(from, to) {
    const rows = await DB.byIndex('orders', 'day', DB.range(from, to));
    return rows.filter((o) => o.status !== 'open').sort((a, b) => a.paidAt - b.paidAt);
  }
  async function movesBetween(from, to) {
    return DB.byIndex('moves', 'day', DB.range(from, to));
  }
  async function movesFor(ingId) {
    return (await DB.byIndex('moves', 'ing', ingId)).sort((a, b) => b.at - a.at);
  }
  async function countsBetween(from, to) {
    return DB.byIndex('counts', 'day', DB.range(from, to));
  }
  async function shifts() {
    return (await DB.all('shifts')).sort((a, b) => b.openedAt - a.openedAt);
  }
  async function cashFor(shiftId) {
    return (await DB.byIndex('cash', 'shift', shiftId)).sort((a, b) => a.at - b.at);
  }
  async function auditLog(limit) {
    const all = await DB.all('audit');
    return all.sort((a, b) => b.at - a.at).slice(0, limit || 300);
  }
  /* Average daily use per ingredient over the last n days (sales + waste). */
  async function usage(days) {
    const to = U.dayKey();
    const from = U.addDays(to, -(days - 1));
    const moves = await movesBetween(from, to);
    const out = {};
    for (const m of moves) if ((m.type === 'sale' || m.type === 'waste') && m.qty < 0) out[m.ing] = (out[m.ing] || 0) - m.qty;
    const span = Math.max(1, Math.min(days, U.daysBetween(U.dayKey(S.meta.createdAt), to) + 1));
    for (const k in out) out[k] /= span;
    return out;
  }

  /* Rebuild on-hand from the ledger: the integrity check for stock. */
  async function verifyStock() {
    const moves = await DB.all('moves');
    const sum = {};
    for (const m of moves) sum[m.ing] = (sum[m.ing] || 0) + m.qty;
    const diffs = [];
    for (const id in S.ings) {
      const want = r3(sum[id] || 0);
      const ing = S.ings[id];
      if (Math.abs(want - ing.onHand) > 0.01) diffs.push({ id, name: ing.name, stored: ing.onHand, ledger: want });
      else if (Math.abs(L.lotsTotal(L.lotsOf(ing)) - Math.max(0, ing.onHand)) > 0.01) diffs.push({ id, name: ing.name, stored: ing.onHand, lots: L.lotsTotal(L.lotsOf(ing)) });
    }
    return { moves: moves.length, diffs };
  }

  M.core = {
    PAY,
    TYPES,
    ROLES,
    can,
    menu,
    load,
    refreshToday,
    setup,
    login,
    logout,
    checkPin,
    approverByPin,
    newCart,
    persistCart,
    cartTotals,
    addLine,
    addCustom,
    addMore,
    setQty,
    patchLine,
    removeSent,
    setCart,
    clearCart,
    holdCart,
    resume,
    completeSale,
    recordSale,
    createTicket,
    voidOrder,
    refundOrder,
    setKitchen,
    discLabel,
    openShift,
    cashMove,
    closeShift,
    drawer,
    receive,
    waste,
    count,
    adjust,
    saveIngredient,
    usedIn,
    saveItem,
    saveCat,
    saveUser,
    saveSettings,
    saveMeta,
    ordersBetween,
    movesBetween,
    movesFor,
    countsBetween,
    shifts,
    cashFor,
    auditLog,
    usage,
    verifyStock,
    build: { buildSale, buildVoid, buildRefund, buildReceive, buildWaste, buildAdjust, buildCount, buildOpenShift, buildCloseShift, buildCash, emptyTot },
  };
})((window.M = window.M || {}));

/* js/demo.js */
/* Mogoba POS: sample history for the demo: two weeks of trading built with the same
 * builders as live sales (so every number in Reports, Stock and Drawer reconciles).
 * Never pushed to sync. Wiped by Settings → Data → Start fresh. */
(function (M) {
  'use strict';
  const U = M.util;
  const L = M.logic;

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const FOOD = [
    ['gimbap-dosirak', 14], ['chicken-dosirak', 12], ['tteokbokki', 9], ['ramyeon', 8], ['pork-dosirak', 6], ['gimbap', 7],
    ['chicken-box', 4], ['chicken-pops', 4], ['fries', 4], ['chicken-fries', 4], ['col-pop', 3], ['kimchi-tub', 1.1],
    ['fishcake-tub', 1], ['cucumber-kimchi', 0.6], ['pickled-radish', 0.5], ['extra-rice', 2.5], ['extra-mozz', 0.8],
  ];
  const DRINK = [
    ['mt-wintermelon', 5], ['mt-okinawa', 4], ['mt-taro', 3], ['mt-cookies', 3], ['mt-matcha', 2], ['mt-chocolate', 2], ['mt-redvelvet', 2],
    ['ft-wintermelon', 1.5], ['ft-strawberry', 1.2], ['ft-lychee', 1.4], ['ft-mango', 1.2], ['mc-dirty', 1.2], ['mc-latte', 1], ['mc-strawberry', 1],
    ['fs-blueberry', 0.8], ['fs-greenapple', 0.8], ['fs-lemon', 0.9], ['fs-passion', 0.8], ['fs-watermelon', 0.7],
    ['cf-spanish', 2], ['cf-americano', 1], ['cf-latte', 1.4], ['cf-macchiato', 0.6], ['cf-cappuccino', 0.6], ['sd-coke', 2], ['sd-water', 1],
  ];
  const BILAO = [['bilao-gimbap-s', 3], ['bilao-gimbap-m', 2], ['bilao-chicken', 2], ['bilao-bihon', 2], ['bilao-suyuk', 1.5]];
  const HOURS = [[9, 2], [10, 4], [11, 9], [12, 12], [13, 9], [14, 5], [15, 5], [16, 6], [17, 9], [18, 11], [19, 7]];
  const FLAV = [['classic', 3], ['honey', 3], ['spicy', 3], ['prinkle', 2]];
  const SIZE = [['s', 2], ['m', 5], ['l', 3]];
  /* Bought short and never restocked, so the demo ends with real low and out-of-stock alerts. */
  const NEGLECT = ['mozzarella', 'taro', 's_lychee', 'cheesepowder', 'tub'];

  async function generate(onProgress) {
    const S = M.state;
    const B = M.core.build;
    const rand = rng(20261004);
    const pick = (list) => {
      const total = list.reduce((s, x) => s + x[1], 0);
      let r = rand() * total;
      for (const x of list) if ((r -= x[1]) <= 0) return x[0];
      return list[list.length - 1][0];
    };
    const chance = (p) => rand() < p;
    const int = (a, b) => a + Math.floor(rand() * (b - a + 1));

    const DAYS = 14;
    const now = Date.now();
    const today = U.dayKey(now);
    const start = U.addDays(today, -DAYS);
    const [owner, mark, joy] = S.users;
    const ings = {};
    for (const k in S.ings) ings[k] = Object.assign({}, S.ings[k], { onHand: 0 });
    const ctx = { settings: S.settings, meta: Object.assign({}, S.meta, { createdAt: U.dayStart(start) }), shift: null, user: owner, ings, menu: M.core.menu() };
    const out = { orders: [], moves: [], shifts: [], cash: [], counts: [], audit: [] };
    const apply = (b) => {
      for (const k in b.ings) ings[k] = b.ings[k];
      if (b.moves) out.moves.push(...b.moves);
    };
    const audit = (at, by, action, detail, approver) => out.audit.push({ id: U.uid(), at, by: { id: by.id, name: by.name }, approver: approver ? { id: approver.id, name: approver.name } : null, action, detail });
    const T = (day, h, m) => U.dayStart(day) + (h * 60 + m) * 60000 + Math.floor(rand() * 50000);

    for (let d = 0; d <= DAYS; d++) {
      const day = U.addDays(start, d);
      const isToday = day === today;
      const dow = new Date(U.dayStart(day)).getDay();
      const weekend = dow === 0 || dow === 6;

      /* 08:00 deliveries */
      ctx.user = owner;
      const rows = [];
      for (const k in ings) {
        const ing = ings[k];
        const neglect = NEGLECT.includes(k);
        if (neglect && d > 0) continue;
        if (d > 0 && ing.onHand > ing.reorder * 1.6) continue;
        const target = neglect ? ing.par * 0.45 : ing.par;
        const units = Math.ceil(Math.max(0, target - ing.onHand) / ing.buyFactor - 1e-9);
        if (units <= 0) continue;
        rows.push({ ing: k, qty: units * ing.buyFactor, unitCost: ing.cost * (0.96 + rand() * 0.08), exp: ing.shelfLife ? U.addDays(day, ing.shelfLife) : '' });
      }
      if (rows.length) {
        const at = T(day, 8, 0);
        apply(B.buildReceive(ctx, rows, { supplier: d === 0 ? 'Opening stock' : 'Aparri market & suppliers' }, at));
        audit(at, owner, 'stock.receive', rows.length + ' items');
      }
      if (isToday && now < T(day, 8, 46)) break;

      /* open shift */
      const cashier = dow === 0 ? mark : joy;
      ctx.user = cashier;
      ctx.shift = B.buildOpenShift(ctx, 100000, T(day, 8, 45));
      audit(ctx.shift.openedAt, cashier, 'shift.open', 'Float ₱1,000.00');

      /* orders */
      const n = weekend ? int(55, 68) : int(36, 50);
      const times = [];
      for (let i = 0; i < n; i++) times.push(T(day, pick(HOURS), int(0, 59)));
      times.sort((a, b) => a - b);
      const bilaoCount = chance(0.6) ? int(1, 2) : 0;
      for (let i = 0; i < times.length; i++) {
        const at = times[i];
        if (isToday && at > now - 60000) break;
        const cart = M.core.newCart();
        cart.createdAt = at - int(60, 400) * 1000;
        const type = pick([['dine', 50], ['take', 40], ['delivery', 10]]);
        cart.type = type;
        if (type === 'dine') cart.table = String(int(1, 8));
        if (type === 'delivery') cart.channel = pick([['foodpanda', 5], ['grab', 3], ['own', 2]]);
        const want = [];
        if (i < bilaoCount && i < 3) want.push([pick(BILAO), 1]);
        const foods = type === 'dine' ? int(1, 3) : int(1, 2);
        for (let f = 0; f < foods; f++) want.push([pick(FOOD), chance(0.15) ? 2 : 1]);
        if (chance(0.58)) want.push([pick(DRINK), chance(0.25) ? 2 : 1]);
        if (chance(0.15)) want.push([pick(DRINK), 1]);
        for (const [id, qty] of want) {
          const item = S.items[id];
          if (!item) continue;
          let variant = null;
          if (item.variants) {
            const vid = item.variantLabel === 'Size' ? pick(SIZE) : item.variantLabel === 'Flavour' ? pick(FLAV) : item.variants[int(0, item.variants.length - 1)].id;
            variant = item.variants.find((v) => v.id === vid) || item.variants[0];
          }
          const mods = [];
          if ((item.addons || []).includes('addon') && chance(item.id === 'tteokbokki' ? 0.35 : 0.12)) {
            const g = S.mods.addon;
            const o = item.id === 'tteokbokki' ? g.options.find((x) => x.id === 'mozz') : g.options[int(0, g.options.length - 1)];
            mods.push({ gid: g.id, oid: o.id, name: o.name, price: o.price });
          }
          /* the cashier would have marked a sold-out dish unavailable */
          const probe = { itemId: item.id, variantId: variant ? variant.id : '', mods: mods.map((m) => ({ gid: m.gid, oid: m.oid })), qty };
          const use = L.consumption([probe], ctx.menu);
          let ok = true;
          for (const k in use) if (ings[k] && ings[k].onHand < use[k]) ok = false;
          if (!ok) continue;
          const unit = (variant ? variant.price : item.price) + mods.reduce((s, m) => s + m.price, 0);
          const note = item.cat === 'milktea' && chance(0.2) ? 'Less sugar' : item.id === 'tteokbokki' && chance(0.15) ? 'Extra spicy' : '';
          cart.lines.push({ id: U.uid(), itemId: item.id, name: item.name, cat: item.cat, variantId: variant ? variant.id : '', variantName: variant ? variant.name : '', mods, unit, qty, note, sent: type === 'dine' });
        }
        if (!cart.lines.length) continue;
        let approver = null;
        if (chance(0.05)) {
          const diners = Math.max(1, Math.min(4, cart.lines.length + int(-1, 1)));
          cart.disc = { kind: 'scpwd', count: 1, diners, people: [{ type: chance(0.6) ? 'SC' : 'PWD', name: 'Sample guest ' + (out.orders.length + 1), idNo: 'DEMO-' + U.pad(int(1, 99999), 5) }] };
        } else if (chance(0.02)) {
          approver = mark;
          cart.disc = { kind: 'pct', value: 10, reason: 'Suki discount', approver: { id: mark.id, name: mark.name } };
        }
        const total = L.totals(cart, { vat: !!S.settings.business.vat }).total;
        const method = type === 'delivery' && cart.channel !== 'own' ? cart.channel : pick([['cash', 68], ['gcash', 27], ['maya', 5]]);
        let pays;
        if (method === 'cash') {
          const steps = [total, Math.ceil(total / 5000) * 5000, Math.ceil(total / 10000) * 10000, Math.ceil(total / 50000) * 50000, 100000];
          const tendered = steps.filter((x) => x >= total)[int(0, 3)] || total;
          pays = [L.makePayment(total, [], { method: 'cash', tendered })];
        } else {
          pays = [L.makePayment(total, [], { method, tendered: total, ref: method === 'gcash' || method === 'maya' ? String(int(1000000000, 9999999999)) : '' })];
        }
        ctx.user = chance(0.85) ? cashier : mark;
        const b = B.buildSale(ctx, cart, pays, at);
        b.order.kitchen = 'done';
        apply(b);
        ctx.meta = b.meta;
        ctx.shift = b.shift;
        out.orders.push(b.order);
        if (approver) audit(at, ctx.user, 'discount', b.order.no + ' · 10% Suki discount', approver);
      }

      /* a void and a partial refund every few days */
      ctx.user = cashier;
      const dayOrders = out.orders.filter((o) => o.day === day && o.status === 'paid');
      if (d % 3 === 1 && dayOrders.length > 10) {
        const idx = int(3, dayOrders.length - 3);
        const o = dayOrders[idx];
        const at = o.paidAt + 4 * 60000;
        const b = B.buildVoid(ctx, o, { reason: 'Customer cancelled before food was made', restock: true, approver: mark }, at);
        apply(b);
        ctx.shift = b.shift;
        out.orders[out.orders.indexOf(o)] = b.order;
        audit(at, cashier, 'void', o.no + ' · Customer cancelled', mark);
      }
      if (d % 4 === 2 && dayOrders.length > 12) {
        const o = dayOrders.find((x, j) => j > 6 && x.status === 'paid' && x.lines.length >= 2 && x.payments[0].method === 'cash');
        if (o) {
          const at = o.paidAt + 9 * 60000;
          const b = B.buildRefund(ctx, o, { picks: [{ lineId: o.lines[0].id, qty: 1 }], reason: 'Wrong flavour served', restock: false, method: 'cash', approver: mark }, at);
          apply(b);
          ctx.shift = b.shift;
          out.orders[out.orders.indexOf(o)] = b.order;
          audit(at, cashier, 'refund', o.no + ' · ' + U.peso(b.refund.amount) + ' · Wrong flavour served', mark);
        }
      }

      /* petty cash */
      if (chance(0.6)) {
        const at = T(day, 10, int(0, 50));
        const b = B.buildCash(ctx, 'out', int(6, 12) * 1000, 'Ice', mark, at);
        ctx.shift = b.shift;
        out.cash.push(b.entry);
      }
      if (d % 4 === 3) {
        const at = T(day, 14, int(0, 50));
        const b = B.buildCash(ctx, 'out', 115000, 'LPG refill', mark, at);
        ctx.shift = b.shift;
        out.cash.push(b.entry);
      }

      if (isToday) break;

      /* end of day: waste, weekly count, close */
      const wrows = [{ ing: 'rice', qty: int(3, 7) * 100 }];
      if (d % 3 === 0) wrows.push({ ing: 'oil', qty: 3000 });
      if (chance(0.3)) wrows.push({ ing: 'kimchi', qty: int(2, 5) * 100 });
      apply(B.buildWaste(ctx, wrows, d % 3 === 0 ? 'Oil change and leftover rice' : 'Leftover rice', T(day, 20, 5)));
      /* closing check: anything past its use-by date tomorrow is thrown out */
      const expired = [];
      for (const k in ings) for (const lot of L.lotsOf(ings[k])) if (lot.exp && lot.exp <= day && lot.qty > 0) expired.push({ ing: k, qty: lot.qty, lot: lot.id });
      if (expired.length) apply(B.buildWaste(ctx, expired, 'Expired', T(day, 20, 8)));
      if (d === 7 || d === DAYS - 1) {
        ctx.user = owner;
        const crow = ['chicken', 'pork', 'rice', 'oil', 'kimchi', 'tteok', 'pearls', 'cup_m', 'box_dosirak', 'seaweed'].map((k) => {
          const ing = ings[k];
          const loss = ing.unit === 'pc' ? -int(0, 3) : -Math.round(ing.onHand * (0.005 + rand() * 0.03));
          return { ing: k, counted: Math.max(0, Math.round((ing.onHand + loss) * 10) / 10) };
        });
        const b = B.buildCount(ctx, crow, 'Weekly count', T(day, 20, 10));
        apply(b);
        out.counts.push(b.count);
        ctx.user = cashier;
      }
      const dr = L.drawer(ctx.shift);
      const diff = chance(0.7) ? 0 : pick([[-2000, 2], [-500, 3], [1000, 2], [-10000, 0.5]]);
      const counted = dr.expected + diff;
      const counts = {};
      let rest = counted;
      for (const den of L.DENOMS) {
        counts[den] = Math.floor(rest / den);
        rest -= counts[den] * den;
      }
      counts.cents = rest;
      const b = B.buildCloseShift(ctx, counts, diff ? 'Checked twice' : '', T(day, 20, 15));
      ctx.meta = b.meta;
      out.shifts.push(b.shift);
      audit(b.shift.closedAt, cashier, 'shift.close', 'Z' + b.shift.zNo + ' · ' + (diff === 0 ? 'balanced' : (diff > 0 ? 'over ' : 'short ') + U.peso(Math.abs(diff))));
      ctx.shift = null;
      if (onProgress) onProgress((d + 1) / (DAYS + 1));
    }
    if (ctx.shift) out.shifts.push(ctx.shift);
    /* the last few of today's orders are still in the kitchen */
    out.orders
      .filter((o) => o.day === today && o.status === 'paid')
      .filter((o) => now - o.paidAt < 25 * 60000)
      .slice(-3)
      .forEach((o, i, a) => (o.kitchen = i === a.length - 1 ? 'prep' : 'ready'));

    const meta = Object.assign({}, ctx.meta, { demo: true, lastBackup: Date.now() });
    await M.db.write(['orders', 'moves', 'ings', 'shifts', 'cash', 'counts', 'audit', 'kv'], (t) => {
      for (const o of out.orders) t.put('orders', o);
      for (const m of out.moves) t.put('moves', m);
      for (const k in ings) t.put('ings', ings[k]);
      for (const s of out.shifts) t.put('shifts', s);
      for (const c of out.cash) t.put('cash', c);
      for (const c of out.counts) t.put('counts', c);
      for (const a of out.audit) t.put('audit', a);
      t.put('kv', { k: 'meta', v: meta });
    });
    sampleOnline(now);
    return { orders: out.orders.length, moves: out.moves.length };
  }

  /* Two website orders so Orders > Online has something to show: one waiting for the GCash
   * check, one already picked up. Same record shape the customer site writes. */
  function sampleOnline(now) {
    const S = M.state;
    const it = (id, vid, qty, mods) => {
      const item = S.items[id];
      const v = vid ? item.variants.find((x) => x.id === vid) : null;
      const ms = (mods || []).map((oid) => {
        const o = S.mods.addon.options.find((x) => x.id === oid);
        return { gid: 'addon', oid, name: o.name, price: o.price };
      });
      return { itemId: id, variantId: vid || '', name: item.name, variantName: v ? v.name : '', mods: ms, unit: (v ? v.price : item.price) + ms.reduce((t, m) => t + m.price, 0), qty, note: '' };
    };
    const rec = (code, minsAgo, status, method, lines, extra) => {
      const at = now - minsAgo * 60000;
      const subtotal = lines.reduce((t, l) => t + l.unit * l.qty, 0);
      return Object.assign(
        {
          code,
          token: U.randHex(16),
          clientId: U.uid(),
          createdAt: at,
          updatedAt: at,
          status,
          customer: { name: 'Sample customer', phone: '09171234567' },
          fulfillment: { type: 'pickup', time: 'asap', address: '', landmark: '' },
          lines,
          subtotal,
          deliveryFee: 0,
          total: subtotal,
          payment: { method, ref: method === 'cash' ? '' : '1012345678901', sender: method === 'cash' ? '' : 'Sample C.', proof: '', verified: false },
          note: '',
          reason: '',
          etaAt: 0,
          timeline: [{ status: 'pending', at, by: 'customer' }],
          posOrderId: '',
        },
        extra || {}
      );
    };
    try {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        if (k && k.indexOf('mogoba.bridge.order.') === 0) localStorage.removeItem(k);
      }
      const a = rec('MGB-2041', 3, 'pending', 'gcash', [it('chicken-dosirak', 'honey', 2, ['mozz']), it('mt-wintermelon', 'l', 1)]);
      const b = rec('MGB-1987', 95, 'completed', 'cash', [it('gimbap-dosirak', null, 1)], { timeline: [{ status: 'pending', at: now - 95 * 60000, by: 'customer' }, { status: 'accepted', at: now - 92 * 60000, by: 'register' }, { status: 'ready', at: now - 75 * 60000, by: 'register' }, { status: 'completed', at: now - 70 * 60000, by: 'register' }], updatedAt: now - 70 * 60000 });
      localStorage.setItem('mogoba.bridge.order.' + a.code, JSON.stringify(a));
      localStorage.setItem('mogoba.bridge.order.' + b.code, JSON.stringify(b));
    } catch (e) {
      /* storage blocked: the Online tab simply starts empty */
    }
  }

  /* Placeholder wallet QR for the sample data: QR-like but not decodable, stamped SAMPLE.
   * The real GCash and Maya codes are uploaded in Settings → Online ordering. */
  function sampleQr(seedText, color) {
    try {
      const N = 25;
      const px = 12;
      const pad = 2 * px;
      const size = N * px + pad * 2;
      const cv = document.createElement('canvas');
      cv.width = cv.height = size;
      const g = cv.getContext('2d');
      g.fillStyle = '#fff';
      g.fillRect(0, 0, size, size);
      let x = 0;
      for (const ch of seedText) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
      const rnd = () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296);
      const finder = (r, c) => r < 8 && c < 8 || r < 8 && c >= N - 8 || r >= N - 8 && c < 8;
      g.fillStyle = '#111';
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!finder(r, c) && rnd() < 0.5) g.fillRect(pad + c * px, pad + r * px, px, px);
      for (const [r, c] of [[0, 0], [0, N - 7], [N - 7, 0]]) {
        g.fillRect(pad + c * px, pad + r * px, 7 * px, 7 * px);
        g.fillStyle = '#fff';
        g.fillRect(pad + (c + 1) * px, pad + (r + 1) * px, 5 * px, 5 * px);
        g.fillStyle = '#111';
        g.fillRect(pad + (c + 2) * px, pad + (r + 2) * px, 3 * px, 3 * px);
      }
      const bw = size * 0.62;
      const bh = size * 0.2;
      g.fillStyle = color;
      g.fillRect((size - bw) / 2, (size - bh) / 2, bw, bh);
      g.fillStyle = '#fff';
      g.font = '800 ' + Math.round(bh * 0.5) + 'px system-ui, sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText('SAMPLE', size / 2, size / 2);
      return cv.toDataURL('image/png');
    } catch (e) {
      return '';
    }
  }

  M.demo = { generate, sampleQr };
})((window.M = window.M || {}));

/* js/sync.js */
/* Mogoba POS: online sync.
 * Every committed change appends an event to the outbox in the same transaction. This engine
 * pushes the outbox oldest-first to the configured endpoint; each event carries a unique eid,
 * so a retried batch is safe to replay (the server de-duplicates on eid). Sales never wait for
 * the network: offline, events just queue. */
(function (M) {
  'use strict';
  const S = M.state;
  const st = { state: 'local', pending: 0, lastOk: 0, error: '', backoff: 0 };
  let busy = false;
  let timer = null;
  let started = false;

  function enabled() {
    const c = S.settings && S.settings.sync;
    return !!(c && c.enabled && c.url && S.meta && !S.meta.demo);
  }

  function compute() {
    if (S.meta && S.meta.demo) st.state = 'demo';
    else if (!enabled()) st.state = 'local';
    else if (!navigator.onLine) st.state = 'offline';
    else if (busy) st.state = 'syncing';
    else if (st.error) st.state = 'error';
    else st.state = st.pending ? 'pending' : 'ok';
  }

  async function refresh() {
    try {
      st.pending = await M.db.count('outbox');
    } catch (e) {
      /* db closed */
    }
    compute();
    M.bus.emit('sync', st);
  }

  function schedule(ms) {
    clearTimeout(timer);
    timer = setTimeout(run, ms);
  }

  function post(url, key, body) {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 20000);
    return fetch(url, {
      method: 'POST',
      cache: 'no-store',
      headers: Object.assign({ 'Content-Type': 'application/json' }, key ? { Authorization: 'Bearer ' + key } : {}),
      body: JSON.stringify(body),
      signal: ctl.signal,
    }).finally(() => clearTimeout(to));
  }

  async function run() {
    clearTimeout(timer);
    if (busy || !enabled() || !navigator.onLine) return refresh();
    busy = true;
    compute();
    M.bus.emit('sync', st);
    const cfg = S.settings.sync;
    try {
      for (let guard = 0; guard < 40; guard++) {
        const batch = await M.db.outboxBatch(50);
        if (!batch.length) break;
        const res = await post(cfg.url, cfg.key, {
          device: S.meta.deviceId,
          deviceName: S.settings.device.name,
          shop: S.settings.business.name,
          sentAt: Date.now(),
          events: batch.map((e) => ({ eid: e.eid, kind: e.kind, at: e.at, data: e.data })),
        });
        if (!res.ok) throw new Error('Server answered ' + res.status);
        let acked = batch.map((e) => e.eid);
        try {
          const j = await res.json();
          if (j && Array.isArray(j.ack)) acked = j.ack;
        } catch (e) {
          /* empty 2xx body = everything accepted */
        }
        const set = new Set(acked);
        const done = batch.filter((e) => set.has(e.eid));
        if (!done.length) throw new Error('Server accepted none of the changes');
        await M.db.write(['outbox'], (t) => {
          for (const e of done) t.del('outbox', e.seq);
        });
      }
      st.error = '';
      st.backoff = 0;
      st.lastOk = Date.now();
    } catch (e) {
      st.error = e.name === 'AbortError' ? 'The server took too long to answer' : e.message || String(e);
      st.backoff = Math.min(300000, Math.max(5000, st.backoff * 2));
      schedule(st.backoff);
    } finally {
      busy = false;
      await refresh();
    }
  }

  M.sync = {
    status: st,
    enabled,
    refresh,
    run,
    kick() {
      refresh();
      if (enabled() && !busy) schedule(800);
    },
    start() {
      if (started) return;
      started = true;
      addEventListener('online', () => {
        st.backoff = 0;
        run();
      });
      addEventListener('offline', refresh);
      setInterval(() => {
        if (enabled() && !busy && !st.backoff) run();
        else refresh();
      }, 30000);
      run();
    },
  };
})((window.M = window.M || {}));

/* js/print.js */
/* Mogoba POS: receipts, kitchen tickets and shift reports as fixed-width text.
 * The same text drives the on-screen preview, browser printing (58/80 mm) and the ESC/POS
 * byte stream used by Bluetooth thermal printers in the Android build. */
(function (M) {
  'use strict';
  const U = M.util;
  const L = M.logic;

  const width = () => (M.state.settings && M.state.settings.print.paper === 80 ? 48 : 32);
  const amt = (c) => U.num2(c);

  function lr(left, right, w) {
    left = String(left);
    right = String(right);
    const space = w - right.length;
    if (left.length > space - 1) {
      const head = wrap(left, w);
      const last = head.pop();
      if (last.length <= space - 1) return head.concat([last + ' '.repeat(space - last.length) + right]).join('\n');
      return head.concat([last, ' '.repeat(Math.max(0, w - right.length)) + right]).join('\n');
    }
    return left + ' '.repeat(space - left.length) + right;
  }
  function wrap(s, w) {
    const out = [];
    for (const para of String(s).split('\n')) {
      let line = '';
      for (const word of para.split(' ')) {
        if (!line) line = word;
        else if ((line + ' ' + word).length <= w) line += ' ' + word;
        else {
          out.push(line);
          line = word;
        }
        while (line.length > w) {
          out.push(line.slice(0, w));
          line = line.slice(w);
        }
      }
      out.push(line);
    }
    return out;
  }
  const center = (s, w) =>
    wrap(s, w)
      .map((x) => ' '.repeat(Math.max(0, Math.floor((w - x.length) / 2))) + x)
      .join('\n');
  const rule = (w, ch) => (ch || '-').repeat(w);

  function header(w) {
    const b = M.state.settings.business;
    const out = [center(b.name.toUpperCase(), w)];
    if (b.address) out.push(center(b.address, w));
    if (b.phone) out.push(center('Tel ' + b.phone, w));
    if (b.tin) out.push(center((b.vat ? 'VAT Reg TIN ' : 'NON-VAT Reg TIN ') + b.tin, w));
    return out;
  }

  function lineBlock(l, w) {
    const out = [lr(l.qty + ' ' + l.name, amt(L.lineGross(l)), w)];
    const sub = [];
    if (l.variantName) sub.push(l.variantName);
    for (const m of l.mods || []) sub.push('+ ' + m.name);
    if (l.qty > 1 || (l.mods || []).length) sub.push('@ ' + amt(l.unit));
    for (const s of sub) out.push('   ' + s);
    if (l.note) out.push('   * ' + l.note);
    const d = L.lineDiscount(l);
    if (d) out.push(lr('   Less ' + (l.disc.reason || 'discount'), '-' + amt(d), w));
    return out;
  }

  function receipt(order, opts) {
    const w = (opts && opts.width) || width();
    const b = M.state.settings.business;
    const t = order.totals || L.totals(order, { vat: !!b.vat });
    const out = header(w);
    out.push(rule(w));
    out.push(lr(b.receiptTitle || 'ORDER SLIP', order.queue ? 'Order #' + order.queue : '', w));
    if (order.no) out.push('No. ' + order.no);
    out.push(U.fmtDateTime(order.paidAt || Date.now()));
    out.push(M.core.TYPES[order.type] + (order.table ? ' · Table ' + order.table : '') + (order.channel && order.channel !== 'own' ? ' · ' + M.core.PAY[order.channel] : ''));
    if (order.customer) out.push('Name: ' + order.customer);
    if (order.by) out.push('Cashier: ' + order.by.name);
    out.push(rule(w));
    for (const l of order.lines) out.push(...lineBlock(l, w));
    out.push(rule(w));
    out.push(lr('Items', String(t.items), w));
    if (t.lineDisc || t.orderDisc || t.vatRemoved) out.push(lr('Subtotal', amt(t.gross), w));
    if (t.lineDisc) out.push(lr('Less item discounts', '-' + amt(t.lineDisc), w));
    if (order.disc && order.disc.kind === 'scpwd') {
      if (t.vatRemoved) out.push(lr('Less VAT (exempt share)', '-' + amt(t.vatRemoved), w));
      out.push(lr('Less SC/PWD 20%', '-' + amt(t.orderDisc), w));
    } else if (t.orderDisc) out.push(lr('Less ' + (order.disc.reason || 'discount'), '-' + amt(t.orderDisc), w));
    out.push(lr('TOTAL', '₱' + amt(t.total), w));
    if (b.vat) {
      out.push(lr('VATable sales', amt(t.vatable), w));
      out.push(lr('VAT 12%', amt(t.vat), w));
      out.push(lr('VAT-exempt sales', amt(t.vatExempt), w));
    }
    for (const p of order.payments || []) {
      if (p.method === 'none') continue;
      out.push(lr(M.core.PAY[p.method] + (p.ref ? ' ' + p.ref : ''), amt(p.method === 'cash' ? p.tendered : p.amount), w));
    }
    const ch = L.changeDue(order.payments);
    if (ch) out.push(lr('Change', amt(ch), w));
    for (const r of order.refunds || []) out.push(lr('Refunded ' + U.fmtTime(r.at), '-' + amt(r.amount), w));
    if (order.status === 'voided') out.push('', center('*** VOIDED ***', w));
    if (order.disc && order.disc.kind === 'scpwd') {
      out.push(rule(w));
      out.push('SC/PWD discount ' + order.disc.count + ' of ' + order.disc.diners + ' diners');
      for (const p of order.disc.people || []) {
        out.push(p.type + ' ' + p.name);
        out.push('ID ' + p.idNo);
      }
      out.push('', 'Signature: ' + '_'.repeat(Math.max(4, w - 11)));
    }
    out.push(rule(w));
    if (b.footer) out.push(center(b.footer, w));
    if (opts && opts.copy) out.push('', center('REPRINT ' + U.fmtDateTime(Date.now()), w));
    return out.join('\n');
  }

  function kitchen(order) {
    const w = width();
    const out = [center('KITCHEN', w), rule(w, '=')];
    out.push(lr(order.queue ? '#' + order.queue : order.table ? 'Table ' + order.table : 'Ticket', U.fmtTime(order.paidAt || order.heldAt || Date.now()), w));
    out.push(M.core.TYPES[order.type] + (order.table ? ' · Table ' + order.table : '') + (order.customer ? ' · ' + order.customer : ''));
    out.push(rule(w));
    for (const l of order.lines) {
      out.push(...wrap(l.qty + ' x ' + l.name + (l.variantName ? ', ' + l.variantName : ''), w));
      for (const m of l.mods || []) out.push('    + ' + m.name);
      if (l.note) out.push('    ** ' + l.note.toUpperCase());
    }
    out.push(rule(w, '='));
    return out.join('\n');
  }

  function shiftReport(shift, cash, kind) {
    const w = width();
    const d = L.drawer(shift);
    const t = shift.tot;
    const out = header(w);
    out.push(rule(w));
    out.push(center(kind === 'Z' ? 'Z-READING  #' + shift.zNo : 'X-READING (shift so far)', w));
    out.push('Opened ' + U.fmtDateTime(shift.openedAt) + (shift.openedBy ? ' by ' + shift.openedBy.name : ''));
    if (shift.closedAt) out.push('Closed ' + U.fmtDateTime(shift.closedAt) + (shift.closedBy ? ' by ' + shift.closedBy.name : ''));
    out.push(rule(w));
    out.push(lr('Orders', String(t.orders), w));
    out.push(lr('Net sales', amt(t.net), w));
    out.push(lr('Discounts given', amt(t.disc), w));
    out.push(lr('Voided orders', String(t.voids), w));
    out.push(rule(w));
    out.push('Payments');
    for (const k of Object.keys(t.sales)) out.push(lr('  ' + M.core.PAY[k], amt(t.sales[k]), w));
    for (const k of Object.keys(t.refunds)) if (t.refunds[k]) out.push(lr('  Refunded ' + M.core.PAY[k], '-' + amt(t.refunds[k]), w));
    out.push(rule(w));
    out.push('Cash drawer');
    out.push(lr('  Opening float', amt(d.float), w));
    out.push(lr('  Cash sales', amt(d.cash), w));
    if (d.refunds) out.push(lr('  Cash refunds', '-' + amt(d.refunds), w));
    if (d.voids) out.push(lr('  Voided cash', '-' + amt(d.voids), w));
    for (const c of cash || []) out.push(lr('  ' + (c.type === 'in' ? 'In: ' : 'Out: ') + c.reason, (c.type === 'in' ? '' : '-') + amt(c.amount), w));
    out.push(lr('  Expected in drawer', amt(d.expected), w));
    if (kind === 'Z') {
      out.push(lr('  Counted', amt(shift.counted), w));
      out.push(lr(shift.overShort === 0 ? '  Balanced' : shift.overShort > 0 ? '  Over' : '  Short', amt(Math.abs(shift.overShort)), w));
      if (shift.note) out.push('  Note: ' + shift.note);
      const ws = Object.entries(shift.wallets || {});
      if (ws.length) {
        out.push(rule(w));
        out.push('E-wallets (app vs register)');
        for (const [k, v] of ws) out.push(lr('  ' + M.core.PAY[k], amt(v.counted) + ' / ' + amt(v.expected), w), lr('  ' + (v.diff === 0 ? 'Matches' : v.diff > 0 ? 'Over' : 'Short'), amt(Math.abs(v.diff)), w));
      }
    }
    out.push(rule(w));
    out.push(center('Printed ' + U.fmtDateTime(Date.now()), w));
    return out.join('\n');
  }

  /* Browser printing through a hidden frame, sized for the receipt roll. */
  function printText(text) {
    if (M.ENV === 'preview') {
      M.ui.toast('Printing is turned off in this web preview. It works in the Android app and in Chrome.', 'err', 5000);
      return;
    }
    const paper = M.state.settings.print.paper === 80 ? 80 : 58;
    const f = document.createElement('iframe');
    f.setAttribute('aria-hidden', 'true');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    document.body.appendChild(f);
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const d = f.contentDocument;
    d.open();
    d.write('<!doctype html><html><head><meta charset="utf-8"><title>Receipt</title><style>@page{size:' + paper + 'mm auto;margin:0}html,body{margin:0;background:#fff}body{padding:3mm 2mm;font:' + (paper === 80 ? 12 : 11) + 'px/1.25 ui-monospace,Menlo,Consolas,"Courier New",monospace;white-space:pre;color:#000}</style></head><body>' + esc(text) + '</body></html>');
    d.close();
    setTimeout(() => {
      try {
        f.contentWindow.focus();
        f.contentWindow.print();
      } catch (e) {
        M.ui.toast('Printing is not available here.', 'err');
      }
      setTimeout(() => f.remove(), 3000);
    }, 60);
  }

  /* ESC/POS bytes for 58/80 mm Bluetooth printers (used by the Android build). */
  function escpos(text) {
    const ascii = text.replace(/₱/g, 'P').replace(/[\u2013\u2014]/g, '-').replace(/·/g, '-').replace(/[^\x20-\x7e\n]/g, '');
    const bytes = [0x1b, 0x40, 0x1b, 0x74, 0x00];
    for (const ch of ascii) bytes.push(ch === '\n' ? 0x0a : ch.charCodeAt(0));
    bytes.push(0x0a, 0x0a, 0x0a, 0x1d, 0x56, 0x42, 0x00);
    return new Uint8Array(bytes);
  }

  M.print = { receipt, kitchen, shiftReport, printText, escpos, width, wrap };
})((window.M = window.M || {}));

/* js/online.js */
/* Mogoba POS: online ordering, register side.
 * Publishes the menu, availability, hours and payment details for the customer site, picks
 * up new orders, and sends status changes back. Two transports carry the same JSON
 * (docs/online-ordering.md): the server over HTTP, or localStorage on the same device for
 * the demo. Accepting a GCash or Maya order records a paid sale; a cash order becomes an
 * open ticket that the cashier charges at pickup. */
(function (M) {
  'use strict';
  const U = M.util;
  const L = M.logic;
  const C = M.core;
  const S = M.state;
  const h = U.h;
  const ui = () => M.ui;

  const BR = 'mogoba.bridge.';
  const NEXT = {
    pending: ['accepted', 'rejected', 'cancelled'],
    accepted: ['preparing', 'ready', 'cancelled'],
    preparing: ['ready'],
    ready: ['out_for_delivery', 'completed'],
    out_for_delivery: ['completed'],
  };
  const LABEL = { pending: 'To confirm', accepted: 'Confirmed', preparing: 'Preparing', ready: 'Ready', out_for_delivery: 'Out for delivery', completed: 'Completed', rejected: 'Not accepted', cancelled: 'Cancelled' };
  const REJECT = ['Payment not found', 'Amount does not match', 'Sold out', 'Closed', 'Outside delivery area'];
  const state = { orders: {}, since: 0, status: 'off', error: '', seen: new Set(), acked: new Set(), timer: null, nag: null, lastHash: '' };
  const FORMAT = { gcash: [/^\d{13}$/, '13 digits'], maya: [/^[0-9A-F]{12}$/, '12 letters and digits'] };
  const VERIFY_PIN_FROM = 100000;

  const cfg = () => (S.settings && S.settings.online) || {};
  const enabled = () => !!cfg().enabled;
  const isDemo = () => (cfg().mode || 'demo') === 'demo';
  const base = () => String(cfg().url || '').replace(/\/+$/, '');

  /* ---------- transports ---------- */
  function lsGet(k) {
    try {
      return JSON.parse(localStorage.getItem(k) || 'null');
    } catch (e) {
      return null;
    }
  }
  function lsSet(k, v) {
    try {
      localStorage.setItem(k, JSON.stringify(v));
      localStorage.setItem(BR + 'ping', String(Date.now()));
      return true;
    } catch (e) {
      return false;
    }
  }
  async function api(method, path, body) {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 15000);
    try {
      const res = await fetch(base() + path, { method, cache: 'no-store', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (cfg().key || '') }, body: body ? JSON.stringify(body) : undefined, signal: ctl.signal });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.error || 'Server answered ' + res.status);
      return j;
    } finally {
      clearTimeout(to);
    }
  }
  const T = {
    publish(snap) {
      if (isDemo()) return Promise.resolve(lsSet(BR + 'store', snap));
      return api('PUT', '/pos/store', snap);
    },
    async list() {
      if (isDemo()) {
        const out = [];
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.indexOf(BR + 'order.') === 0) {
              const o = lsGet(k);
              if (o && o.code) out.push(o);
            }
          }
        } catch (e) {
          /* storage blocked */
        }
        return out;
      }
      /* The server pages large polls (screenshots are heavy) and says more: true. */
      let out = [];
      for (let page = 0; page < 10; page++) {
        const j = await api('GET', '/pos/orders?since=' + state.since);
        state.since = j.now || state.since;
        out = out.concat(j.orders || []);
        if (!j.more) break;
      }
      return out;
    },
    async status(o, patch) {
      if (isDemo()) {
        const cur = lsGet(BR + 'order.' + o.code) || o;
        const at = Date.now();
        const next = Object.assign({}, cur, patch, { updatedAt: at, timeline: (cur.timeline || []).concat([{ status: patch.status, at, by: 'register' }]) });
        next.payment = Object.assign({}, cur.payment, patch.payment || {}, patch.verified != null ? { verified: patch.verified } : {});
        delete next.verified;
        lsSet(BR + 'order.' + o.code, next);
        return next;
      }
      const j = await api('POST', '/pos/orders/' + encodeURIComponent(o.code) + '/status', patch);
      return j.order || Object.assign({}, o, patch);
    },
  };

  /* ---------- store snapshot for the customer site ---------- */
  function snapshot() {
    const c = cfg();
    const b = S.settings.business;
    const ings = S.ings;
    const items = Object.values(S.items)
      .filter((i) => i.active !== false && i.online !== false)
      .sort((a, z) => S.cats.findIndex((x) => x.id === a.cat) - S.cats.findIndex((x) => x.id === z.cat) || a.sort - z.sort)
      .map((i) => {
        const variants = (i.variants || []).map((v) => ({ id: v.id, name: v.name, price: v.price, soldOut: L.makeable(i, v.id, ings) === 0 }));
        return {
          id: i.id,
          cat: i.cat,
          name: i.name,
          ko: i.ko || '',
          img: i.img || '',
          price: i.price,
          badge: i.badge || '',
          soldOut: L.itemAvailability(i, ings) === 0,
          prepay: i.cat === 'bilao' || !!i.prepay,
          variantLabel: i.variantLabel || '',
          variants,
          addons: (i.addons || []).map((gid) => S.mods[gid]).filter(Boolean).map((g) => ({ gid: g.id, name: g.name, options: g.options.map((o) => ({ id: o.id, name: o.name, price: o.price })) })),
        };
      });
    const cats = S.cats.filter((x) => items.some((i) => i.cat === x.id)).map((x) => ({ id: x.id, name: x.name, ko: x.ko || '' }));
    const pay = c.payments || {};
    return {
      v: 1,
      updatedAt: Date.now(),
      name: b.name,
      address: b.address,
      phone: b.phone,
      accepting: !!c.accepting,
      pausedUntil: c.pausedUntil > Date.now() ? c.pausedUntil : 0,
      hours: c.hours || [],
      prepMinutes: c.prepMinutes || 20,
      pickup: { enabled: c.pickup !== false },
      delivery: Object.assign({ enabled: false, fee: 0, minOrder: 0, area: '' }, c.delivery || {}),
      payments: {
        gcash: Object.assign({ enabled: false, accountName: '', number: '', qr: '' }, pay.gcash || {}),
        maya: Object.assign({ enabled: false, accountName: '', number: '', qr: '' }, pay.maya || {}),
        cash: Object.assign({ enabled: true, maxTotal: 100000 }, pay.cash || {}),
      },
      cats,
      items,
    };
  }

  async function publish(force) {
    if (!enabled()) return;
    const snap = snapshot();
    const hash = JSON.stringify(Object.assign({}, snap, { updatedAt: 0 }));
    if (!force && hash === state.lastHash) return;
    try {
      await T.publish(snap);
      state.lastHash = hash;
      state.error = '';
    } catch (e) {
      state.error = e.message;
    }
    M.bus.emit('online');
  }
  const publishSoon = U.debounce(() => publish(false), 1500);

  /* ---------- picking up orders ---------- */
  /* The server stops sending the payment screenshot once an order leaves pending; keep the copy
   * this register already has so the order can still be checked later. */
  function keepProof(prev, o) {
    const old = prev && prev.payment && prev.payment.proof;
    if (old && o.payment && !o.payment.proof) o.payment = Object.assign({}, o.payment, { proof: old });
    return o;
  }

  function chime() {
    try {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return;
      const ac = (chime.ac = chime.ac || new A());
      [0, 0.18].forEach((t, i) => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.frequency.value = i ? 1046 : 784;
        g.gain.setValueAtTime(0.0001, ac.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.16);
        o.connect(g).connect(ac.destination);
        o.start(ac.currentTime + t);
        o.stop(ac.currentTime + t + 0.18);
      });
    } catch (e) {
      /* sound is optional */
    }
  }

  async function refresh() {
    if (!enabled() || !S.user) return;
    try {
      const list = await T.list();
      let fresh = 0;
      for (const o of list) {
        const prev = state.orders[o.code];
        state.orders[o.code] = keepProof(prev, o);
        if (o.status === 'pending' && !state.seen.has(o.code)) {
          state.seen.add(o.code);
          if (!prev && state.status !== 'off') fresh++;
        }
      }
      state.status = 'ok';
      state.error = '';
      if (fresh) {
        chime();
        ui().toast(fresh === 1 ? 'New online order' : fresh + ' new online orders', 'ok');
      }
    } catch (e) {
      state.status = 'error';
      state.error = e.name === 'AbortError' ? 'The server took too long to answer' : e.message;
    }
    M.bus.emit('online');
  }

  /* New orders keep chiming every 15 s until someone opens the Online tab. */
  const unacked = () => list().filter((o) => o.status === 'pending' && !state.acked.has(o.code));
  function ack() {
    for (const o of list()) if (o.status === 'pending') state.acked.add(o.code);
  }

  function start() {
    clearInterval(state.timer);
    clearInterval(state.nag);
    state.status = 'off';
    /* Switching between demo and server starts a fresh inbox. */
    const where = isDemo() ? 'demo' : base();
    if (state.where !== where) {
      state.where = where;
      state.orders = {};
      state.since = 0;
    }
    if (!enabled()) return M.bus.emit('online');
    publish(true);
    refresh();
    state.timer = setInterval(refresh, isDemo() ? 4000 : 10000);
    state.nag = setInterval(() => {
      if (S.user && unacked().length) chime();
    }, 15000);
  }

  addEventListener('storage', (e) => {
    if (enabled() && isDemo() && e.key && e.key.indexOf(BR) === 0 && e.key !== BR + 'store') refresh();
  });
  M.bus.on('menu', publishSoon);
  M.bus.on('stock', publishSoon);
  M.bus.on('change', publishSoon);
  M.bus.on('settings', () => {
    state.lastHash = '';
    if (S.user) start();
  });

  const list = () => Object.values(state.orders).sort((a, b) => b.createdAt - a.createdAt);
  const pendingCount = () => list().filter((o) => o.status === 'pending').length;

  /* ---------- actions ---------- */
  /* A reference is good for one order only, whatever happened to the other order. */
  function duplicateRef(o) {
    if (!o.payment || !o.payment.ref) return null;
    return list().find((x) => x.code !== o.code && x.payment && x.payment.method === o.payment.method && x.payment.ref === o.payment.ref) || null;
  }
  function duplicateProof(o) {
    const sha = o.payment && o.payment.proofSha;
    if (!sha) return null;
    return list().find((x) => x.code !== o.code && x.payment && x.payment.proofSha === sha) || null;
  }
  function refFormatOk(o) {
    const f = FORMAT[o.payment && o.payment.method];
    return !f || !o.payment.ref || f[0].test(o.payment.ref);
  }

  function posLines(o) {
    const lines = o.lines.map((l) => ({
      id: U.uid(),
      itemId: S.items[l.itemId] ? l.itemId : null,
      name: l.name,
      cat: S.items[l.itemId] ? S.items[l.itemId].cat : 'custom',
      variantId: l.variantId || '',
      variantName: l.variantName || '',
      mods: (l.mods || []).map((m) => ({ gid: m.gid, oid: m.oid, name: m.name, price: m.price })),
      unit: l.unit,
      qty: l.qty,
      note: l.note || '',
      sent: false,
    }));
    if (o.deliveryFee > 0) lines.push({ id: U.uid(), itemId: null, name: 'Delivery fee', cat: 'custom', variantId: '', variantName: '', mods: [], unit: o.deliveryFee, qty: 1, note: '', sent: false });
    return lines;
  }

  async function setStatus(o, status, extra) {
    const allowed = NEXT[o.status] || [];
    if (!allowed.includes(status)) throw new Error('Cannot move an order from ' + LABEL[o.status] + ' to ' + LABEL[status] + '.');
    const next = await T.status(o, Object.assign({ status }, extra || {}));
    state.orders[o.code] = keepProof(o, next);
    M.bus.emit('online');
    return next;
  }

  async function accept(o, etaMin, check) {
    const pay = o.payment || {};
    const cart = {
      type: o.fulfillment.type === 'delivery' ? 'delivery' : 'take',
      channel: o.fulfillment.type === 'delivery' ? 'online' : '',
      customer: o.customer.name + ' · ' + o.code,
      lines: posLines(o),
      source: 'online',
      onlineCode: o.code,
    };
    /* A retry after a failed status update must not record the sale twice. */
    const prior = S.today.find((x) => x.onlineCode === o.code && x.status !== 'voided') || S.open.find((x) => x.onlineCode === o.code);
    let posOrderId = '';
    if (prior) posOrderId = prior.id;
    else if (pay.method === 'gcash' || pay.method === 'maya') {
      if (!S.shift) throw new Error('Open a shift before accepting paid online orders.');
      const sale = await C.recordSale(cart, [{ method: pay.method, amount: o.total, tendered: o.total, change: 0, ref: pay.ref || '' }]);
      posOrderId = sale.id;
    } else {
      const t = await C.createTicket(Object.assign(cart, { table: '', customer: o.customer.name + ' · ' + o.code }));
      posOrderId = t.id;
    }
    const extra = { verified: pay.method !== 'cash', etaAt: Date.now() + (etaMin || cfg().prepMinutes || 20) * 60000, posOrderId };
    if (check) extra.payment = { amountReceived: check.amount, verifiedBy: check.by, verifiedAt: Date.now() };
    return setStatus(o, 'accepted', extra);
  }

        dup ? h('div.oo-warn', ui().icon('alert', 16), 'Reference already used by ' + dup.code + '.') : null,

      }
