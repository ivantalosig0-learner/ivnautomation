    const max = tk.top;
    const box = h('div.chart');
    const s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': o.label || '' });
    for (let v = 0; v <= max + 1e-6; v += tk.step) {
      const y = pad.t + ih - (ih * v) / max;
      s.appendChild(svg('line', { x1: pad.l, x2: W - pad.r, y1: y, y2: y, class: 'grid-l' }));
      const t = svg('text', { x: pad.l - 8, y: y + 4, 'text-anchor': 'end', class: 'axis-t' });
      t.textContent = (o.tick || tickLabel)(v);
      s.appendChild(t);
    }
    const band = iw / data.length;
    const bw = Math.min(24, band * 0.62);
    const peak = data.reduce((b, d, i) => (d.value > data[b].value ? i : b), 0);
    const every = data.length > 16 ? 3 : data.length > 10 ? 2 : 1;
    const tip = tooltip(box);
    const fmt = o.fmt || U.peso;
    data.forEach((d, i) => {
      const x = pad.l + band * i + (band - bw) / 2;
      const bh = max ? (ih * Math.max(0, d.value)) / max : 0;
      const g = svg('g', { tabindex: '0', role: 'listitem', 'aria-label': (d.full || d.label) + ': ' + fmt(d.value) + (d.mark != null ? ', usual ' + fmt(d.mark) : '') });
      g.appendChild(svg('rect', { x: pad.l + band * i, y: pad.t, width: band, height: ih, class: 'hit' }));
      if (bh > 0) g.appendChild(svg('path', { d: colPath(x, pad.t + ih - bh, bw, bh), class: 'bar' + (d.dim ? ' dim' : '') }));
      if (d.mark != null && d.mark > 0) {
        const my = pad.t + ih - (ih * d.mark) / max;
        g.appendChild(svg('line', { x1: x - 3, x2: x + bw + 3, y1: my, y2: my, class: 'mark-l' }));
      }
      const show = () => {
        g.classList.add('on');
        tip.show(s, x + bw / 2, pad.t + ih - Math.max(bh, d.mark ? (ih * d.mark) / max : 0), W, H, [h('b', fmt(d.value)), d.full || d.label, d.mark != null ? h('div.muted', 'Usual ' + fmt(d.mark)) : null, d.sub ? h('div.muted', d.sub) : null]);
      };
      const hide = () => {
        g.classList.remove('on');
        tip.hide();
      };
      g.addEventListener('pointerenter', show);
      g.addEventListener('pointerleave', hide);
      g.addEventListener('focus', show);
      g.addEventListener('blur', hide);
      s.appendChild(g);
      if (i % every === 0 || i === data.length - 1) {
        const t = svg('text', { x: pad.l + band * i + band / 2, y: H - 8, 'text-anchor': 'middle', class: 'axis-t' });
        t.textContent = d.label;
        s.appendChild(t);
      }
      if (i === peak && d.value > 0 && o.peakLabel !== false) {
        const t = svg('text', { x: x + bw / 2, y: pad.t + ih - bh - 6, 'text-anchor': 'middle', class: 'val-t' });
        t.textContent = U.peso0(d.value);
        s.appendChild(t);
      }
    });
    box.prepend(s);
    const legend = data.some((d) => d.mark != null) ? h('div.legend', { style: { marginTop: '6px' } }, h('span', h('i.c-gold'), o.seriesLabel || 'Today'), h('span', h('i.mark-key'), o.markLabel || 'Usual')) : null;
    const table = o.table === false ? null : h('details', { style: { marginTop: '6px' } }, h('summary.muted', { style: { fontSize: '12.5px', cursor: 'pointer' } }, 'Table'), h('table.tbl', h('tbody', data.map((d) => h('tr', h('td', d.full || d.label), h('td.r', fmt(d.value)), d.mark != null ? h('td.r.muted', fmt(d.mark)) : null)))));
    return h('div', box, legend, table);
  }

  /* Horizontal bars. rows: [{name, value, sub, cls}] */
  function hbars(rows, fmt, opts) {
    const o = opts || {};
    const max = o.max || Math.max(...rows.map((r) => r.value), 1);
    return h(
      'div.hbars',
      { role: 'list' },
      rows.map((r) =>
        h(
          'div.hbar',
          { role: 'listitem', 'aria-label': r.name + ': ' + fmt(r.value) + (r.sub ? ', ' + r.sub : '') },
          h('span.nm', { title: r.name }, r.name),
          h('span.track', h('i', { class: r.cls || '', style: { width: Math.max(1, (Math.max(0, r.value) / max) * 100) + '%' } })),
          h('span.v', fmt(r.value), r.sub ? h('span.muted', { style: { fontWeight: 600, marginLeft: '6px' } }, r.sub) : null)
        )
      )
    );
  }

  /* Busy-hours heatmap. grid[day 0..6][hour] = value. One gold ramp, light to dark. */
  function heatmap(grid, hours, opts) {
    const o = opts || {};
    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const order = [1, 2, 3, 4, 5, 6, 0];
    const max = Math.max(1, ...order.map((d) => Math.max(...hours.map((hr) => grid[d][hr] || 0))));
    const box = h('div.heat', { role: 'table', 'aria-label': o.label || 'Busy hours' });
    box.style.gridTemplateColumns = '44px repeat(' + hours.length + ', minmax(0, 1fr))';
    box.append(h('span'), ...hours.map((hr) => h('span.heat-h', { role: 'columnheader' }, String(hr % 12 || 12))));
    for (const d of order) {
      box.append(h('span.heat-d', { role: 'rowheader' }, DAYS[d]));
      for (const hr of hours) {
        const v = grid[d][hr] || 0;
        const a = v / max;
        box.append(h('span.heat-c', { role: 'cell', title: DAYS[d] + ' ' + (hr % 12 || 12) + (hr < 12 ? ' AM' : ' PM') + ': ' + (o.fmt ? o.fmt(v) : v), style: { background: v ? 'rgba(232, 163, 61, ' + (0.12 + a * 0.85).toFixed(2) + ')' : 'var(--soft)' } }));
      }
    }
    return h('div', box, h('div.legend', { style: { marginTop: '8px' } }, h('span', 'Quiet'), h('span.heat-ramp'), h('span', 'Busiest')));
  }

  /* Menu engineering: each item is placed by popularity (qty sold) and margin per serving,
   * split at the averages, and listed in its box with the numbers that put it there.
   * points: [{name, qty, margin}] */
  function matrix(points) {
    const avgQ = points.reduce((t, p) => t + p.qty, 0) / (points.length || 1);
    const avgM = points.reduce((t, p) => t + p.margin, 0) / (points.length || 1);
    const boxes = [
      ['star', 'Stars', 'Sell well, earn well. Keep them visible.', (p) => p.qty >= avgQ && p.margin >= avgM],
      ['puzzle', 'Puzzles', 'Earn well, sell less. Promote them.', (p) => p.qty < avgQ && p.margin >= avgM],
      ['horse', 'Workhorses', 'Sell well, earn less. Check portions and price.', (p) => p.qty >= avgQ && p.margin < avgM],
      ['dog', 'Dogs', 'Sell less, earn less. Rethink or drop.', (p) => p.qty < avgQ && p.margin < avgM],
    ];
    return h(
      'div.matrix',
      boxes.map(([cls, title, hint, test]) => {
        const items = points.filter(test).sort((a, b) => b.qty * b.margin - a.qty * a.margin);
        return h(
          'div.mx',
          { class: 'mx-' + cls },
          h('div.mx-head', h('b', title), h('span.muted', String(items.length))),
          h('div.mx-hint', hint),
          items.length
            ? h('ul', items.slice(0, 5).map((p) => h('li', h('span.nm', p.name), h('span.num', p.qty + ' · ' + U.peso0(p.margin)))))
            : h('div.muted', { style: { fontSize: '13px' } }, 'None'),
          items.length > 5 ? h('div.muted', { style: { fontSize: '12px' } }, '+' + (items.length - 5) + ' more') : null
        );
      })
    );
  }

  M.charts = { svg, ticks, tickLabel, columns, hbars, heatmap, matrix };
})((window.M = window.M || {}));

/* js/views/overview.js */
/* Mogoba POS: Overview. The day at a glance for the owner and managers: sales against
 * target and against a usual day, what needs attention, stock to watch, best sellers. */
(function (M) {
  'use strict';
  const U = M.util;
  const L = M.logic;
  const C = M.core;
  const S = M.state;
  const h = U.h;
  const ui = () => M.ui;

  const OPEN_H = 9;
  const CLOSE_H = 20;

  function mins(ts) {
    const d = new Date(ts);
    return d.getHours() * 60 + d.getMinutes();
  }

  async function history() {
    const t = U.dayKey();
    const orders = await C.ordersBetween(U.addDays(t, -28), U.addDays(t, -1));
    return orders.filter((o) => o.status !== 'voided');
  }

  function tile(label, value, extra, opts) {
    const o = opts || {};
    return h('div.stat.glass', { class: o.cls || '' }, h('span.label', label), h('span.value', { style: o.color ? { color: o.color } : null }, value), extra);
  }

  function attention(items) {
    if (!items.length) return h('div.empty', { style: { padding: '24px 8px' } }, h('h3', 'All clear'), h('p', 'Nothing needs you right now.'));
    return h(
      'div.list',
      items.map((x) =>
        h(
          'button.row.att',
          { type: 'button', onclick: x.go },
          h('span.att-dot', { class: x.level }),
          h('div.grow', h('div.t', x.title), x.sub ? h('div.s', x.sub) : null),
          x.count != null ? h('span.att-n', String(x.count)) : null,
          ui().icon('right', 18)
        )
      )
    );
  }

  function mount(el) {
    const body = h('div.stack');
    U.mount(el, h('div.page', body));
    let hist = null;
    let token = 0;

    async function draw() {
      const my = ++token;
      if (!hist) hist = await history();
      if (my !== token) return;
      const now = Date.now();
      const today = U.dayKey();
      const dow = new Date().getDay();
      const cfg = S.settings;
      const target = (cfg.sales && cfg.sales.dailyTarget) || 0;
      const orders = S.today.filter((o) => o.status !== 'open');
      const r = L.aggregate(orders, C.menu());

      /* the same weekday over the last four weeks gives "a usual day" */
      const sameDays = {};
      for (const o of hist) if (new Date(o.paidAt).getDay() === dow) (sameDays[o.day] = sameDays[o.day] || []).push(o);
      const nSame = Object.keys(sameDays).length || 1;
      const usualHour = new Array(24).fill(0);
      let usualByNow = 0;
      let usualDay = 0;
      for (const d in sameDays)
        for (const o of sameDays[d]) {
          const net = L.orderNet(o);
          usualHour[new Date(o.paidAt).getHours()] += net / nSame;
          usualDay += net / nSame;
          if (mins(o.paidAt) <= mins(now)) usualByNow += net / nSame;
        }
      const lastWeek = U.addDays(today, -7);
      const lwByNow = hist.filter((o) => o.day === lastWeek && mins(o.paidAt) <= mins(now)).reduce((t, o) => t + L.orderNet(o), 0);

      /* expected share of the day done by now, from the usual curve, else from clock time */
      const share = usualDay > 0 ? usualByNow / usualDay : Math.max(0, Math.min(1, (mins(now) / 60 - OPEN_H) / (CLOSE_H - OPEN_H)));
      const expectedNow = target * share;
      const pace = target ? r.net / target : 0;
      /* projected close: today so far divided by the share a usual day has reached by now */
      const projected = share > 0.08 ? Math.round(r.net / share) : 0;

      /* 7-day sparklines */
      const days = [];
      for (let i = 6; i >= 1; i--) days.push(U.addDays(today, -i));
      const byDay = {};
      for (const o of hist) if (days.includes(o.day)) {
        const b = (byDay[o.day] = byDay[o.day] || { net: 0, n: 0 });
        b.net += L.orderNet(o);
        b.n++;
      }
      const sparkNet = days.map((d) => (byDay[d] ? byDay[d].net : 0)).concat([r.net]);
      const sparkN = days.map((d) => (byDay[d] ? byDay[d].n : 0)).concat([r.orders]);
      const sparkAvg = days.map((d) => (byDay[d] && byDay[d].n ? byDay[d].net / byDay[d].n : 0)).concat([r.avg]);
      const fc = r.foodCostPct;
      const fcTarget = (cfg.sales && cfg.sales.foodCostTarget) || 40;
      const fcState = fc * 100 <= fcTarget ? 'ok' : fc * 100 <= fcTarget + 5 ? 'low' : 'out';
      const vs = (cur, prev) => (prev > 0 ? h('span.delta', { class: cur >= prev ? 'up' : 'down' }, (cur >= prev ? '▲ ' : '▼ ') + U.pct(Math.abs(cur - prev) / prev, 0) + ' vs last ' + new Intl.DateTimeFormat('en-PH', { weekday: 'short' }).format(new Date())) : h('span.sub', 'No sales same time last week'));

      const parts = [];
      parts.push(
        h(
          'div.cards.kpis',
          h(
            'div.stat.glass.hero',
            h('span.label', 'Net sales today'),
            h('span.value', U.peso(r.net)),
            target
              ? h(
                  'div.target',
                  ui().bullet(r.net, target, projected, { expected: expectedNow, label: 'Sales against daily target' }),
                  h('div.legend', h('span', U.pct(pace, 0) + ' of ', h('b', U.peso0(target))), projected ? h('span', 'On track for ', h('b', U.peso0(projected))) : null, h('span', r.net >= expectedNow ? 'Ahead of pace' : 'Behind by ' + U.peso0(expectedNow - r.net)))
                )
              : h('span.sub', 'Set a daily target in Settings'),
            vs(r.net, lwByNow)
          ),
          tile('Orders', String(r.orders), h('div.kpi-foot', ui().spark(sparkN), h('span.sub', 'last 7 days'))),
          tile('Average order', U.peso(r.avg), h('div.kpi-foot', ui().spark(sparkAvg), h('span.sub', 'last 7 days'))),
          tile('Food cost', r.net ? U.pct(fc, 0) : '-', h('div.target', ui().level(fc * 100, Math.max(60, fc * 100), { state: fcState, marker: fcTarget, markerLabel: 'Target ' + fcTarget + '%', label: 'Food cost percent' }), h('div.legend', h('span', 'Target ', h('b', fcTarget + '%')), h('span', 'Recipe cost ', h('b', U.peso0(r.cogs))))), { color: fcState === 'out' ? 'var(--bad)' : null })
        )
      );

      /* attention list */
      const items = [];
      const queue = orders.filter((o) => o.status === 'paid' && o.kitchen && o.kitchen !== 'done');
      if (queue.length) {
        const oldest = Math.round((now - Math.min(...queue.map((o) => o.paidAt))) / 60000);
        items.push({ level: oldest > 20 ? 'bad' : oldest > 12 ? 'warn' : 'ok', title: queue.length + ' in the kitchen queue', sub: 'Oldest ' + oldest + ' min', count: queue.length, go: () => M.app.go('orders') });
      }
      if (M.online && M.online.pendingCount() > 0) items.push({ level: 'bad', title: 'Online orders to confirm', sub: 'Check payment, then accept', count: M.online.pendingCount(), go: () => M.online.inbox() });
      const ings = Object.values(S.ings).filter((i) => i.active !== false);
      const out = ings.filter((i) => L.stockStatus(i) === 'out');
      const low = ings.filter((i) => L.stockStatus(i) === 'low');
      if (out.length) items.push({ level: 'bad', title: out.length + ' out of stock', sub: out.slice(0, 3).map((i) => i.name).join(', '), count: out.length, go: () => M.app.go('stock') });
      if (low.length) items.push({ level: 'warn', title: low.length + ' running low', sub: low.slice(0, 3).map((i) => i.name).join(', '), count: low.length, go: () => M.stockView.reorderSheet() });
      const exp = M.stockView.expiringLots();
      const expired = exp.filter((x) => x.state === 'expired');
      if (exp.length) items.push({ level: expired.length ? 'bad' : 'warn', title: expired.length ? expired.length + ' expired lots' : exp.length + ' lots expire soon', sub: exp.slice(0, 3).map((x) => x.ing.name).join(', '), count: exp.length, go: () => M.app.go('stock') });
      if (S.open.length) items.push({ level: 'ok', title: S.open.length + ' open tickets', sub: S.open.slice(0, 3).map((o) => (o.table ? 'T' + o.table : o.customer)).join(', '), count: S.open.length, go: () => M.app.go('register') });
      if (!S.shift) items.push({ level: 'warn', title: 'No open shift', sub: 'Open one to take payments', go: () => M.drawerView.openShiftFlow() });
      if (!S.meta.demo && C.can('*') && now - (S.meta.lastBackup || 0) > 3 * 864e5) items.push({ level: 'warn', title: 'Backup is overdue', sub: S.meta.lastBackup ? 'Last ' + U.ago(S.meta.lastBackup) : 'Never backed up', go: () => M.app.go('settings') });

      if (M.online && cfg.online && cfg.online.enabled) {
        const on = M.online.list().filter((o) => U.dayKey(o.createdAt) === today);
        const acc = on.filter((o) => o.timeline && o.timeline.find((x) => x.status === 'accepted'));
        const mins = acc.length ? Math.round(acc.reduce((t, o) => t + (o.timeline.find((x) => x.status === 'accepted').at - o.createdAt), 0) / acc.length / 60000) : 0;
        if (on.length) items.push({ level: 'ok', title: 'Online today: ' + on.length + ' placed, ' + acc.length + ' accepted', sub: on.filter((o) => o.status === 'rejected').length + ' rejected' + (acc.length ? ' · accepted in ' + mins + ' min on average' : ''), go: () => M.online.inbox() });
      }
      const hours = [];
      for (let i = OPEN_H; i < CLOSE_H; i++) hours.push(i);
      const series = hours.map((i) => ({ label: (i % 12 || 12) + (i < 12 ? 'a' : 'p'), full: (i % 12 || 12) + ':00 ' + (i < 12 ? 'AM' : 'PM'), value: r.byHour[i], mark: Math.round(usualHour[i]), sub: r.byHourCount[i] + ' orders', dim: i > new Date().getHours() }));
      parts.push(
        h(
          'div.split',
          h('section.panel.glass', h('div.panel-title', h('h3', 'Sales by hour'), h('span.sub', 'today vs a usual ' + new Intl.DateTimeFormat('en-PH', { weekday: 'long' }).format(new Date()))), M.charts.columns(series, { label: 'Sales by hour, today against a usual day', markLabel: 'Usual', table: false, height: 200 })),
          h('section.panel.glass', h('div.panel-title', h('h3', 'Needs attention'), h('span.sub', items.length ? items.length + (items.length === 1 ? ' item' : ' items') : '')), attention(items))
        )
      );

      /* stock to watch and best sellers */
      const watch = ings
        .filter((i) => i.par > 0)
        .map((i) => ({ i, ratio: i.onHand / i.par }))
        .sort((a, b) => a.ratio - b.ratio)
        .slice(0, 6);
      const top = Object.values(r.items).sort((a, b) => b.qty - a.qty).slice(0, 6);
      const pay = Object.entries(r.byPay).filter(([k, v]) => v > 0 && k !== 'none').sort((a, b) => b[1] - a[1]);
      const PAY_CLS = ['c-gold', 'c-ok', 'c-low', 'c-out', 'c-muted', 'c-muted', 'c-muted'];
      parts.push(
        h(
          'div.split.even',
          h(
            'section.panel.glass',
            h('div.panel-title', h('h3', 'Stock to watch'), h('button.btn.sm', { type: 'button', onclick: () => M.app.go('stock') }, 'Stock')),
            h(
              'div.watch',
              watch.map(({ i }) => {
                const st = L.stockStatus(i);
                return h('div.watch-row', h('span.nm', i.name), ui().level(i.onHand, Math.max(i.par, i.onHand), { state: st, marker: i.reorder, thin: true, label: i.name }), h('span.v', U.fmtQty(Math.max(0, i.onHand), i.unit)));
              })
            )
          ),
          h(
            'section.panel.glass',
            h('div.panel-title', h('h3', 'Best sellers today')),
            top.length ? M.charts.hbars(top.map((x) => ({ name: x.name + (x.variant ? ' · ' + x.variant : ''), value: x.qty, sub: U.peso0(x.net) })), (v) => String(v)) : h('p.muted', 'No sales yet today.'),
            pay.length ? h('div', { style: { marginTop: '16px' } }, h('div.group-label', { style: { marginTop: 0 } }, 'Payments'), ui().stackBar(pay.map(([k, v], i) => ({ value: v, cls: PAY_CLS[i], label: C.PAY[k], text: U.peso0(v) })))) : null
          )
        )
      );
      U.mount(body, ...parts);
    }
    draw();
    const tick = setInterval(draw, 60000);
    const offs = [M.bus.on('change', draw), M.bus.on('stock', draw), M.bus.on('online', draw)];
    return () => {
      clearInterval(tick);
      offs.forEach((f) => f());
    };
  }

  M.views = M.views || {};
  M.views.overview = { title: 'Overview', icon: 'gauge', perm: 'reports', mount };
})((window.M = window.M || {}));

/* js/views/register.js */
/* Mogoba POS: Register: menu grid + live ticket. */
(function (M) {
  'use strict';
  const U = M.util;
  const L = M.logic;
  const C = M.core;
  const S = M.state;
  const h = U.h;
  const ui = () => M.ui;

  const view = { cat: null, q: '' };

  function catOf(id) {
    return S.cats.find((c) => c.id === id) || { tone: 'gold', kind: 'food' };
  }

  function tileFor(item, inCart) {
    const cat = catOf(item.cat);
    const n = L.itemAvailability(item, S.ings);
    const [lo, hi] = M.seed.priceRange(item);
    const price = lo === hi ? U.peso(lo, true) : U.peso(lo, true) + ' to ' + U.peso(hi, true);
    const pic = item.img
      ? h('div.tile-img', { style: { backgroundImage: 'url("' + M.asset('food/' + item.img + '.jpg') + '")' } })
      : h('div.tile-mono', { class: (item.ko || '').length > 3 ? 'small' : '' }, item.ko || item.name.slice(0, 2));
    const badges = h('div.badges');
    if (n === 0) badges.appendChild(ui().badge('out', 'Sold out'));
    else if (n <= 5) badges.appendChild(ui().badge('low', n + ' left'));
    else if (item.badge) badges.appendChild(ui().badge('solid', item.badge));
    return h(
      'button.tile',
      { type: 'button', class: 'tone-' + cat.tone + (n === 0 ? ' out' : ''), 'aria-label': item.name + ', ' + price + (inCart ? ', ' + inCart + ' in order' : '') + (n === 0 ? ', sold out' : ''), onclick: () => tapItem(item) },
      pic,
      badges,
      inCart ? h('span.incart', String(inCart)) : null,
      h('div.tile-body', h('div.tile-name', item.name), h('div.tile-foot', h('span.tile-price', price), item.variants ? h('span.opts-n', item.variants.length + (item.variantLabel === 'Size' ? ' sizes' : ' options')) : null))
    );
  }

  function tapItem(item) {
    const n = L.itemAvailability(item, S.ings);
    if (n === 0 && S.settings.sales.blockOutOfStock) {
      ui().toast(item.name + ' is out of stock. Receive or count stock to sell it.', 'err');
      return;
    }
    if (item.variants || (item.addons || []).length) return M.checkout.itemSheet(item);
    C.addLine(item, null, [], 1, '');
    if (navigator.vibrate) navigator.vibrate(8);
    if (n === 0) ui().toast('Heads up: stock shows no ' + item.name + ' left.', 'err');
  }

  function cartCounts() {
    const m = {};
    for (const l of S.cart.lines) if (l.itemId) m[l.itemId] = (m[l.itemId] || 0) + l.qty;
    return m;
  }

  function visibleItems() {
    const all = Object.values(S.items).filter((i) => i.active !== false);
    const q = view.q.trim().toLowerCase();
    if (q) return all.filter((i) => (i.name + ' ' + (i.ko || '') + ' ' + catOf(i.cat).name).toLowerCase().includes(q)).sort((a, b) => a.sort - b.sort);
    if (view.cat === 'popular') return (S.popular || []).map((id) => S.items[id]).filter((i) => i && i.active !== false);
    return all.filter((i) => i.cat === view.cat).sort((a, b) => a.sort - b.sort);
  }

  /* ---------- ticket (shared by the side panel and the phone sheet) ---------- */
  function renderTicket(box, opts) {
    const c = S.cart;
    const t = C.cartTotals();
    const o = opts || {};

    const typeSeg = ui().seg(
      [['dine', 'Dine-in', 'dine'], ['take', 'Take-out', 'take'], ['delivery', 'Delivery', 'delivery']],
      c.type,
      (v) => C.setCart({ type: v }),
      'Order type'

    const metaInput = (ph, key, mode) => {
      const inp = h('input.input', { value: c[key] || '', placeholder: ph, 'aria-label': ph, maxlength: 40, inputmode: mode || 'text', enterkeyhint: 'done' });
      inp.addEventListener('input', () => {
        S.cart[key] = inp.value;
        S.cart.updatedAt = Date.now();
        C.persistCart();
      });
      return inp;
    };
    const meta = h('div.ticket-meta');
    if (c.type === 'dine') meta.append(metaInput('Table no.', 'table', 'numeric'), metaInput('Name (optional)', 'customer'));

    else {
      const ch = h('select.input', { 'aria-label': 'Delivery channel', onchange: (e) => C.setCart({ channel: e.target.value }) }, [['own', 'Own rider'], ['foodpanda', 'Foodpanda'], ['grab', 'GrabFood']].map(([k, n]) => h('option', { value: k, selected: (c.channel || 'own') === k }, n)));
      meta.append(ch, metaInput('Name / phone', 'customer'));
    }

    const openCount = S.open.filter((x) => x.id !== c.id).length;
    const head = h(
      'div.ticket-head',
      h(
        'div.ticket-title',
        h('h2', c.held ? (c.table ? 'Table ' + c.table : c.customer || 'Open ticket') : 'New order'),
        h('button.btn.sm', { type: 'button', onclick: () => M.checkout.openTickets(), 'aria-label': 'Open tickets, ' + openCount + ' waiting' }, ui().icon('clock', 18), 'Tickets', openCount ? h('span.badge.solid', String(openCount)) : null),
        h('button.icon-btn', { type: 'button', 'aria-label': 'More order actions', onclick: () => M.checkout.orderMenu() }, ui().icon('more'))
      ),
      typeSeg,
      meta
    );

    const lines = h('div.ticket-lines', { role: 'list', 'aria-label': 'Items in this order' });
    if (!c.lines.length) {
      lines.append(h('div.ticket-empty', h('div.k', '먹어봐'), h('b', 'No items yet'), h('span', 'Tap a dish on the menu to add it.')));
    } else {
      for (const l of c.lines) {
        const sub = [];
        if (l.variantName) sub.push(l.variantName);
        for (const m of l.mods) sub.push('+ ' + m.name);
        const gross = L.lineGross(l);
        const net = L.lineNet(l);
        lines.append(
          h(
            'button.tline',
            { type: 'button', role: 'listitem', onclick: () => M.checkout.lineSheet(l.id) },
            h('div.tline-name', h('span.q', l.qty + '×'), h('span', l.name)),
            h('div.tline-amt', net !== gross ? h('s', U.peso(gross)) : null, U.peso(net)),
            sub.length || l.note || l.sent || l.disc
              ? h('div.tline-sub', sub.join(' · '), l.note ? h('div.note', '“' + l.note + '”') : null, l.disc ? h('div', 'Discount ' + (l.disc.kind === 'pct' ? l.disc.value + '%' : U.peso(l.disc.value)) + (l.disc.reason ? ' · ' + l.disc.reason : '')) : null, l.sent ? h('div.sent', 'Sent to kitchen') : null)
              : null
          )
        );
      }
    }

    const foot = h('div.ticket-foot');
    if (c.disc) {
      foot.append(
        h(
          'div.disc-chip',
          ui().icon('tag', 18),
          h('span.grow', C.discLabel(c.disc)),
          h('span.num', '−' + U.peso(t.orderDisc + t.vatRemoved)),
          h('button.icon-btn', { type: 'button', style: { width: '32px', height: '32px' }, 'aria-label': 'Remove discount', onclick: () => C.setCart({ disc: null }) }, ui().icon('x', 16))
        )
      );
    }
    if (t.discountTotal) {
      foot.append(h('div.sumrow', h('span', 'Subtotal'), h('span', U.peso(t.gross))));
      foot.append(h('div.sumrow.disc', h('span', 'Discounts'), h('span', '−' + U.peso(t.discountTotal))));
    }
    if (S.settings.business.vat && t.total) foot.append(h('div.sumrow', h('span', 'incl. VAT 12%'), h('span', U.peso(t.vat))));
    foot.append(h('div.sumrow.total', h('span.lbl', t.items + (t.items === 1 ? ' item' : ' items')), h('span.val', U.peso(t.total))));
    foot.append(
      h(
        'div.ticket-actions',
        h('button.btn.lg', { type: 'button', disabled: !c.lines.length, onclick: () => M.checkout.hold(), 'aria-label': 'Hold ticket' }, ui().icon('pause', 20), h('span.hide-phone.lbl-wide', 'Hold')),
        h('button.btn.lg', { type: 'button', disabled: !c.lines.length, onclick: () => M.checkout.discountSheet(), 'aria-label': 'Discount' }, ui().icon('tag', 20)),
        h('button.btn.primary.charge', { type: 'button', disabled: !c.lines.length, onclick: () => M.checkout.pay(o.sheet) }, 'Charge ', h('span.amt', U.peso(t.total)))
      )
    );
    U.mount(box, head, lines, foot);
  }

  function mount(el) {
    if (!view.cat) view.cat = S.popular && S.popular.length ? 'popular' : S.cats[0] && S.cats[0].id;
    const search = h('input.input', { type: 'search', placeholder: 'Search the menu', 'aria-label': 'Search the menu', value: view.q, enterkeyhint: 'search' });
    const cats = h('div.cats', { role: 'toolbar', 'aria-label': 'Menu categories' });
    const grid = h('div.grid', { 'aria-label': 'Menu items' });
    const ticket = h('section.ticket.glass', { 'aria-label': 'Current order' });
    const cartbar = h('div.cartbar');
    const pane = h('section.menu-pane.glass', h('div.menu-tools', h('div.search', ui().icon('search', 20), search)), cats, grid, cartbar);
    const gate = h('div.gate');
    U.mount(el, h('div.reg', pane, ticket), gate);

    search.addEventListener('input', () => {
      view.q = search.value;
      drawGrid();
    });

    function drawCats() {
      const list = [];
      if (S.popular && S.popular.length) list.push({ id: 'popular', name: 'Popular', ko: '인기', tone: 'red' });
      list.push(...S.cats.filter((c) => Object.values(S.items).some((i) => i.cat === c.id && i.active !== false)));
      U.mount(
        cats,
        list.map((c) =>
          h(
            'button.cat',
            {
              type: 'button',
              class: 'tone-' + c.tone,
              'aria-pressed': String(!view.q && view.cat === c.id),
              onclick: () => {
                view.cat = c.id;
                view.q = '';
                search.value = '';
                drawCats();
                drawGrid();
                grid.scrollTop = 0;
              },
            },
            h('span.ko', c.ko || ''),
            h('span.en', c.name)
          )
        )
      );
    }
    function drawGrid() {
      const counts = cartCounts();
      const items = visibleItems();
      if (!items.length) {
        U.mount(grid, h('div', { style: { gridColumn: '1/-1' } }, ui().empty(view.q ? 'Nothing matches “' + view.q + '”' : 'No items here yet', view.q ? 'Try the Korean or English name.' : 'Add dishes in Menu.')));
        return;
      }
      U.mount(grid, items.map((i) => tileFor(i, counts[i.id])));
      grid.append(h('button.tile.custom', { type: 'button', onclick: () => M.checkout.customItem() }, ui().icon('plus', 26), 'Custom item'));
    }
    function drawCartbar() {
      const t = C.cartTotals();
      U.mount(cartbar, S.cart.lines.length ? h('button.btn.primary', { type: 'button', onclick: () => M.checkout.ticketSheet() }, h('span', t.items + (t.items === 1 ? ' item' : ' items') + ' · View order'), h('span.num', U.peso(t.total))) : null);
    }
    function drawGate() {
      if (S.shift) {
        gate.hidden = true;
        return;
      }
      gate.hidden = false;
      U.mount(
        gate,
        h(
          'div.gate-card.glass',
          h('div.empty-mark', '먹어봐'),
          h('h2', 'Open the shift to start selling'),
          h('p.lead', { style: { margin: 0 } }, 'Count the cash in the drawer. Sales, refunds and pay-outs are tracked against it until close.'),
          h('button.btn.primary.lg.block', { type: 'button', onclick: () => M.drawerView.openShiftFlow() }, ui().icon('drawer'), 'Open shift')
        )
      );
    }
    const drawTicket = () => {
      renderTicket(ticket);
      drawCartbar();
    };
    drawCats();
    drawGrid();
    drawTicket();
    drawGate();
    const offs = [
      M.bus.on('cart', () => {
        drawTicket();
        drawGrid();
      }),
      M.bus.on('change', () => {
        drawTicket();
        drawGrid();
        drawGate();
      }),
      M.bus.on('stock', drawGrid),
      M.bus.on('menu', () => {
        drawCats();
        drawGrid();
      }),
      M.bus.on('settings', drawTicket),
    ];
    return () => offs.forEach((f) => f());
  }

  M.views = M.views || {};
  M.views.register = { title: 'Register', icon: 'pos', perm: 'sell', mount };
  M.register = { renderTicket };
})((window.M = window.M || {}));

/* js/views/checkout.js */
/* Mogoba POS: order-taking flows: item options, line edits, discounts, payment, tickets. */
(function (M) {
  'use strict';
  const U = M.util;
  const L = M.logic;
  const C = M.core;
  const S = M.state;
  const h = U.h;
  const ui = () => M.ui;

  const catOf = (id) => S.cats.find((c) => c.id === id) || { tone: 'gold', kind: 'food' };

  /* ---------- item options ---------- */
  function itemSheet(item) {
    const cat = catOf(item.cat);
    const fast = !!item.variants && !(item.addons || []).length;
    let variant = null;
    let qty = 1;
    const mods = new Map();
    const notes = new Set();
    let other = '';
    const s = ui().sheet({ title: item.name, cls: (item.addons || []).length ? 'medium' : '' });
    const addBtn = h('button.btn.primary.lg.block', { type: 'button', onclick: () => add() });

    const unit = () => (variant ? variant.price : item.price) + Array.from(mods.values()).reduce((t, m) => t + m.price, 0);
    function add() {
      if (item.variants && !variant) {
        ui().toast('Pick a ' + (item.variantLabel || 'option').toLowerCase() + ' first.', 'err');
        return;
      }
      if (variant && S.settings.sales.blockOutOfStock && L.makeable(item, variant.id, S.ings) === 0) {
        ui().toast(variant.name + ' is out of stock.', 'err');
        return;
      }
      const note = Array.from(notes).concat(other.trim() ? [other.trim()] : []).join(', ');
      C.addLine(item, variant, Array.from(mods.values()), qty, note);
      if (navigator.vibrate) navigator.vibrate(8);
      s.close();
    }
    function draw() {
      const hero = h(
        'div.item-hero',
        { class: 'tone-' + cat.tone },
        item.img ? h('div.pic', { style: { backgroundImage: 'url("' + M.asset('food/' + item.img + '.jpg') + '")' } }) : h('div.pic.mono', item.ko ? item.ko.slice(0, 2) : item.name.slice(0, 2)),
        h('div', item.ko ? h('div.ko', item.ko) : null, h('div.nm', item.name), h('div.muted', item.unitNote || (item.variants ? (item.variantLabel === 'Size' ? 'Small · Medium · Large' : item.variants.length + ' options') : U.peso(item.price))))
      );
      const parts = [hero];
      if (item.variants) {
        parts.push(h('div.group-label', item.variantLabel || 'Options', fast ? h('span.badge.muted', 'tap to add') : null));
        parts.push(
          h(
            'div.opts',
            item.variants.map((v) => {
              const n = L.makeable(item, v.id, S.ings);
              return h(
                'button.opt',
                {
                  type: 'button',
                  class: n === 0 ? 'sold' : '',
                  'aria-pressed': String(variant === v),
                  onclick: () => {
                    variant = v;
                    if (fast) return add();
                    draw();
                  },
                },
                h('span.n', v.name),
                h('span.p', U.peso(v.price, true)),
                n === 0 ? h('span.left', 'Sold out') : n <= 5 ? h('span.left', n + ' left') : null
              );
            })
          )
        );
      }
      for (const gid of item.addons || []) {
        const g = S.mods[gid];
        if (!g) continue;
        parts.push(h('div.group-label', g.name));
        parts.push(
          h(
            'div.opts',
            g.options.map((o) => {
              const k = g.id + ':' + o.id;
              return h(
                'button.opt',
                {
                  type: 'button',
                  'aria-pressed': String(mods.has(k)),
                  onclick: () => {
                    if (mods.has(k)) mods.delete(k);
                    else mods.set(k, { gid: g.id, oid: o.id, name: o.name, price: o.price });
                    draw();
                  },
                },
                h('span.n', o.name),
                h('span.p', '+' + U.peso(o.price, true))
              );
            })
          )
        );
      }
      if (!fast) {
        parts.push(h('div.group-label', 'Notes for the kitchen'));
        parts.push(
          h(
            'div.chips',
            (M.seed.NOTES[cat.kind] || M.seed.NOTES.food).map((n) =>
              h(
                'button.chip',
                {
                  type: 'button',
                  'aria-pressed': String(notes.has(n)),
                  onclick: (e) => {
                    if (notes.has(n)) notes.delete(n);
                    else notes.add(n);
                    e.currentTarget.setAttribute('aria-pressed', String(notes.has(n)));
                  },
                },
                n
              )
            )
          )
        );
        const otherIn = h('input.input', { placeholder: 'Other note', 'aria-label': 'Other note', value: other, maxlength: 80, style: { marginTop: '8px' } });
        otherIn.addEventListener('input', () => (other = otherIn.value));
        parts.push(otherIn);
        parts.push(
          h(
            'div.row-gap',
            { style: { marginTop: '16px', justifyContent: 'space-between' } },
            h('b', 'Quantity'),
            ui().stepper(qty, (v) => {
              qty = v;
              addBtn.lastChild.textContent = U.peso(unit() * qty);
            }, { min: 1 })
          )
        );
      } else {
        parts.push(h('p.hint', { style: { marginTop: '14px', textAlign: 'left' } }, 'Need “less sugar” or “no ice”? Tap the drink in the order to add a note.'));
      }
      s.setBody(...parts);
      U.mount(addBtn, 'Add to order · ', h('span.num', U.peso(unit() * qty)));
      addBtn.disabled = !!item.variants && !variant;
      s.setFoot(fast ? null : addBtn);
    }
    draw();
  }

  /* ---------- reason picker for taking back things the kitchen started ---------- */
  function askVoidReason(title, withWaste) {
    return new Promise((res) => {
      let done = false;
      let reason = '';
      let wasted = true;
      const s = ui().sheet({ title, cls: 'narrow', onClose: () => !done && res(null) });
      const inp = h('input.input', { placeholder: 'Reason', 'aria-label': 'Reason', maxlength: 80 });
      inp.addEventListener('input', () => (reason = inp.value));
      const reasons = ['Customer changed their mind', 'Entered by mistake', 'Kitchen mistake', 'Took too long'];
      s.setBody(
        h('p.lead', 'This item was already sent to the kitchen. The removal is logged with your name.'),
        h('div.chips', reasons.map((r) => h('button.chip', { type: 'button', onclick: () => ((inp.value = r), (reason = r)) }, r))),
        h('div', { style: { marginTop: '10px' } }, inp),
        withWaste
          ? h('div', { style: { marginTop: '14px' } }, h('div.group-label', 'Was it already prepared?'), ui().seg([['yes', 'Yes, count as waste'], ['no', 'No, nothing used']], 'yes', (v) => (wasted = v === 'yes'), 'Was it prepared'))
          : null
      );
      s.setFoot(
        h(
          'button.btn.danger-solid.lg.block',
          {
            type: 'button',
            onclick: () => {
              if (!reason.trim()) {
                inp.focus();
                ui().toast('Pick or type a reason.', 'err');
                return;
              }
              done = true;
              res({ reason: reason.trim(), wasted });
              s.close();
            },
          },
          'Remove item'
        )
      );
    });
  }

  /* ---------- line editor ---------- */
  function lineSheet(lineId) {
    const l = S.cart.lines.find((x) => x.id === lineId);
    if (!l) return;
    const cat = catOf(l.cat);
    let qty = l.qty;
    let disc = l.disc ? Object.assign({}, l.disc) : null;
    const chipsList = M.seed.NOTES[cat.kind] || M.seed.NOTES.food;
    const notes = new Set();
    let other = '';
    for (const part of (l.note || '').split(', ').filter(Boolean)) {
      if (chipsList.includes(part)) notes.add(part);
      else other = other ? other + ', ' + part : part;
    }
    const s = ui().sheet({ title: l.name });
    const discRow = h('div.chips');
    const drawDisc = () =>
      U.mount(
        discRow,
        [[null, 'None'], [10, '10%'], [20, '20%'], [50, '50%'], [100, 'Free']].map(([v, t]) =>
          h(
            'button.chip',
            {
              type: 'button',
              'aria-pressed': String(v === null ? !disc : !!disc && disc.kind === 'pct' && disc.value === v),
              onclick: () => {
                disc = v === null ? null : { kind: 'pct', value: v, reason: v === 100 ? 'On the house' : 'Item discount' };
                drawDisc();
              },
            },
            t
          )
        )
      );
    drawDisc();
    const otherIn = h('input.input', { placeholder: 'Other note', 'aria-label': 'Other note', value: other, maxlength: 80, style: { marginTop: '8px' } });
    otherIn.addEventListener('input', () => (other = otherIn.value));
    const sub = [l.variantName].concat(l.mods.map((m) => '+ ' + m.name)).filter(Boolean).join(' · ');
    s.setBody(
      h('p.lead', (sub ? sub + ' · ' : '') + U.peso(l.unit) + ' each' + (l.sent ? ' · sent to kitchen' : '')),
      h('div.row-gap', { style: { justifyContent: 'space-between' } }, h('b', 'Quantity'), ui().stepper(qty, (v) => (qty = v), { min: 0, trash: true })),
      h('div.group-label', 'Notes for the kitchen'),
      h(
        'div.chips',
        chipsList.map((n) =>
          h(
            'button.chip',
            {
              type: 'button',
              'aria-pressed': String(notes.has(n)),
              onclick: (e) => {
                if (notes.has(n)) notes.delete(n);
                else notes.add(n);
                e.currentTarget.setAttribute('aria-pressed', String(notes.has(n)));
              },
            },
            n
          )
        )
      ),
      otherIn,
      h('div.group-label', 'Item discount', !C.can('discount') ? h('span.badge.muted', 'needs manager') : null),
      discRow
    );
    const save = async (removeAll) => {
      const target = removeAll ? 0 : qty;
      const discChanged = JSON.stringify(disc && { k: disc.kind, v: disc.value }) !== JSON.stringify(l.disc && { k: l.disc.kind, v: l.disc.value });
      if (discChanged && disc) {
        const ap = await ui().approve('discount', 'Approve discount', 'Item discounts need a manager or the owner.');
        if (!ap) return;
        disc.approver = { id: ap.id, name: ap.name };
      }
      if (l.sent && target < l.qty) {
        const ap = await ui().approve('void', 'Approve removal', 'Removing food the kitchen already started needs a manager or the owner.');
        if (!ap) return;
        const why = await askVoidReason('Why remove it?', true);
        if (!why) return;
        try {
          await C.removeSent(l.id, l.qty - target, ap, why.reason, why.wasted);
        } catch (e) {
          ui().toast(e.message, 'err');
          return;
        }
      } else if (l.sent && target > l.qty) {
        C.addMore(l.id, target - l.qty);
      } else {
        C.setQty(l.id, target);
      }
      if (target > 0 && S.cart.lines.includes(l)) {
        const note = Array.from(notes).concat(other.trim() ? [other.trim()] : []).join(', ');
        C.patchLine(l.id, { note, disc });
      }
      s.close();
    };
    s.setFoot(h('button.btn.danger.lg', { type: 'button', onclick: () => save(true) }, ui().icon('trash', 20), 'Remove'), h('button.btn.primary.lg', { type: 'button', onclick: () => save(false) }, 'Save'));
  }

  /* ---------- discounts ---------- */
  function discountSheet() {
    const c = S.cart;
    const vat = !!S.settings.business.vat;
    let tab = c.disc ? (c.disc.kind === 'scpwd' ? 'sc' : c.disc.kind) : 'sc';
    const sc = c.disc && c.disc.kind === 'scpwd' ? JSON.parse(JSON.stringify(c.disc)) : { kind: 'scpwd', count: 1, diners: 1, people: [] };
    let pct = c.disc && c.disc.kind === 'pct' ? c.disc.value : 10;
    let amt = c.disc && c.disc.kind === 'amt' ? c.disc.value : 0;
    let reason = c.disc && c.disc.kind !== 'scpwd' ? c.disc.reason || '' : '';
    const s = ui().sheet({ title: 'Discount', icon: 'tag' });

    const preview = (d) => {
      const t = L.totals({ lines: c.lines, disc: d }, { vat });
      return h(
        'dl.kv',
        { style: { marginTop: '16px', padding: '14px', borderRadius: '14px', background: 'var(--soft)' } },
        h('dt', 'Order subtotal'),
        h('dd', U.peso(t.subtotal)),
        d && d.kind === 'scpwd' ? [h('dt', 'Eligible share (' + Math.min(d.count, d.diners) + ' of ' + d.diners + ')'), h('dd', U.peso(t.eligible))] : null,
        t.vatRemoved ? [h('dt', 'VAT exempted'), h('dd', '−' + U.peso(t.vatRemoved))] : null,
        h('dt', d && d.kind === 'scpwd' ? '20% discount' : 'Discount'),
        h('dd', '−' + U.peso(t.orderDisc)),
        h('dt', 'New total'),
        h('dd.big', U.peso(t.total))
      );
    };
    const reasonBlock = () => {
      const inp = h('input.input', { value: reason, placeholder: 'Reason (shows on reports)', 'aria-label': 'Reason', maxlength: 60 });
      inp.addEventListener('input', () => (reason = inp.value));
      return h(
        'div',
        h('div.group-label', 'Reason'),
        h('div.chips', ['Suki discount', 'Staff meal', 'Promo', 'Service recovery'].map((r) => h('button.chip', { type: 'button', onclick: () => ((reason = r), (inp.value = r)) }, r))),
        h('div', { style: { marginTop: '8px' } }, inp)
      );
    };

    function draw() {
      const tabs = ui().seg([['sc', 'Senior / PWD'], ['pct', 'Percent'], ['amt', 'Amount']], tab, (v) => {
        tab = v;
        draw();
      }, 'Discount type');
      const parts = [tabs];
      if (tab === 'sc') {
        while (sc.people.length < sc.count) sc.people.push({ type: 'SC', name: '', idNo: '' });
        sc.people.length = sc.count;
        parts.push(
          h('p.lead', { style: { marginTop: '14px' } }, '20% off the eligible share' + (vat ? ', VAT-exempt,' : '') + ' under RA 9994 / RA 10754. Group meals are shared equally across diners. Record each ID. It prints on the receipt for signature.'),
          h(
            'div.form-grid',
            h('div.field', h('span', 'Senior / PWD diners'), ui().stepper(sc.count, (v) => {
              sc.count = v;
              if (sc.diners < v) sc.diners = v;
              draw();
            }, { min: 1, max: 30 })),
            h('div.field', h('span', 'Total diners on this bill'), ui().stepper(sc.diners, (v) => {
              sc.diners = Math.max(v, sc.count);
              draw();
            }, { min: 1, max: 30 }))
          )
        );
        sc.people.forEach((p, i) => {
          const nm = h('input.input', { value: p.name, placeholder: 'Full name', 'aria-label': 'Full name ' + (i + 1), maxlength: 60 });
          nm.addEventListener('input', () => (p.name = nm.value));
          const id = h('input.input', { value: p.idNo, placeholder: 'OSCA / PWD ID no.', 'aria-label': 'ID number ' + (i + 1), maxlength: 30 });
          id.addEventListener('input', () => (p.idNo = id.value));
          parts.push(
            h(
              'div.stack-sm',
              { style: { marginTop: '14px', padding: '12px', borderRadius: '14px', border: '1px solid var(--line)' } },
              h('div.row-gap', h('b.grow', 'Diner ' + (i + 1)), ui().seg([['SC', 'Senior'], ['PWD', 'PWD']], p.type, (v) => (p.type = v), 'ID type')),
              h('div.form-grid', nm, id)
            )
          );
        });
        parts.push(preview(sc));
      } else if (tab === 'pct') {
        const custom = h('input.input.num', { value: String(pct), inputmode: 'decimal', 'aria-label': 'Percent', style: { maxWidth: '120px' } });
        custom.addEventListener('input', () => {
          const v = parseFloat(custom.value);
          pct = isFinite(v) ? Math.max(0, Math.min(100, v)) : 0;
          prev.replaceWith((prev = preview({ kind: 'pct', value: pct })));
        });
        let prev = preview({ kind: 'pct', value: pct });
        parts.push(
          h('div.group-label', 'Percent off the whole order'),
          h('div.row-gap', h('div.chips', [5, 10, 15, 20, 50].map((v) => h('button.chip', { type: 'button', 'aria-pressed': String(pct === v), onclick: () => ((pct = v), draw()) }, v + '%'))), custom, h('span', '%')),
          reasonBlock(),
          prev
        );
      } else {
        let prev = preview({ kind: 'amt', value: amt });
        const kp = ui().keypad((v) => {
          amt = v;
          const next = preview({ kind: 'amt', value: amt });
          if (prev.parentNode) prev.replaceWith(next);
          prev = next;
        }, amt);
        parts.push(h('div.group-label', 'Peso amount off'), kp.el, reasonBlock(), prev);
      }
      s.setBody(...parts);
      s.setFoot(
        c.disc ? h('button.btn.danger', { type: 'button', onclick: () => (C.setCart({ disc: null }), s.close()) }, 'Remove discount') : null,
        h('button.btn.primary.lg', { type: 'button', onclick: apply }, 'Apply discount')
      );
    }
    async function apply() {
      if (tab === 'sc') {
        const bad = sc.people.findIndex((p) => !p.name.trim() || !p.idNo.trim());
        if (bad >= 0) {
          ui().toast('Enter the name and ID number for diner ' + (bad + 1) + '.', 'err');
          return;
        }
        C.setCart({ disc: { kind: 'scpwd', count: sc.count, diners: sc.diners, people: sc.people.map((p) => ({ type: p.type, name: p.name.trim(), idNo: p.idNo.trim() })) } });
        s.close();
        return;
      }
      const value = tab === 'pct' ? pct : amt;
      if (!(value > 0)) {
        ui().toast('Enter a discount above zero.', 'err');
        return;
      }
      if (!reason.trim()) {
        ui().toast('Add a reason for the discount.', 'err');
        return;
      }
      const ap = await ui().approve('discount', 'Approve discount', 'Order discounts need a manager or the owner.');
      if (!ap) return;
      C.setCart({ disc: { kind: tab, value, reason: reason.trim(), approver: { id: ap.id, name: ap.name } } });
      s.close();
    }
    draw();
  }

  /* ---------- payment ---------- */
  function cashSuggestions(r) {
    const out = [r];
    for (const step of [5000, 10000, 50000, 100000]) {
      const v = Math.ceil(r / step) * step;
      if (v > r && !out.includes(v)) out.push(v);
    }
    for (const bill of [20000, 50000, 100000]) if (bill > r && !out.includes(bill)) out.push(bill);
    return out.sort((a, b) => a - b).slice(0, 5);
  }

  function pay(fromPhoneSheet) {
    if (!S.shift) {
      ui().toast('Open the shift before taking payment.', 'err');
      return M.drawerView.openShiftFlow();
    }
    const c = S.cart;
    if (!c.lines.length) return;
    if (S.settings.sales.blockOutOfStock) {
      const use = L.consumption(c.lines, C.menu());
      const short = Object.keys(use).filter((k) => S.ings[k] && S.ings[k].onHand < use[k]);
      if (short.length) {
        ui().toast('Not enough ' + short.map((k) => S.ings[k].name).join(', ') + ' in stock.', 'err');
        return;
      }
    }
    if (c.type === 'dine' && S.settings.sales.tableForDineIn && !c.table) {
      ui().toast('Enter the table number for dine-in.', 'err');
      return;
    }
    if (fromPhoneSheet) ui().closeAll();
    const total = C.cartTotals().total;
    const payments = [];
    let method = 'cash';
    let entered = 0;
    let ref = '';
    let busy = false;
    const s = ui().sheet({ title: 'Charge ' + U.peso(total), wide: true, icon: 'drawer' });

    async function finish() {
      if (busy) return;
      busy = true;
      try {
        const order = await C.completeSale(payments);
        done(order);
      } catch (e) {
        busy = false;
        ui().toast(e.message, 'err');
        draw();
      }
    }
    function tender(m, amount) {
      try {
        payments.push(L.makePayment(total, payments, { method: m, tendered: amount, ref }));
      } catch (e) {
        ui().toast(e.message, 'err');
        return;
      }
      ref = '';
      entered = 0;
      if (L.due(total, payments) <= 0) finish();
      else draw();
    }
    function draw() {
      const remaining = L.due(total, payments);
      const left = h(
        'div.stack',
        h(
          'div.pay-due',
          h('span.lbl', payments.length ? 'Still to pay' : 'Amount due'),
          h('span.big', { class: remaining <= 0 ? 'done' : '' }, U.peso(Math.max(0, remaining))),
          payments.length ? h('span.muted', 'of ' + U.peso(total)) : h('span.muted', C.TYPES[c.type] + (c.table ? ' · Table ' + c.table : '') + ' · ' + C.cartTotals().items + ' items')
        ),
        payments.length
          ? h(
              'div.pay-list',
              payments.map((p, i) =>
                h(
                  'div.pay-item',
                  h('span.grow', C.PAY[p.method] + (p.ref ? ' · ' + p.ref : '')),
                  h('span', U.peso(p.method === 'cash' ? p.tendered : p.amount)),
                  h('button.icon-btn', { type: 'button', style: { width: '36px', height: '36px' }, 'aria-label': 'Remove payment', onclick: () => (payments.splice(i, 1), draw()) }, ui().icon('x', 16))
                )
              )
            )
          : null,
        total === 0 ? h('button.btn.go.lg.block', { type: 'button', onclick: finish }, 'Complete, no charge') : null
      );
      const methods = h(
        'div.methods',
        { role: 'group', 'aria-label': 'Payment method' },
        ['cash', 'gcash', 'maya', 'card', 'foodpanda', 'grab', 'other'].map((m) =>
          h(
            'button',
            {
              type: 'button',
              'aria-pressed': String(method === m),
              onclick: () => {
                method = m;
                entered = 0;
                ref = '';
                draw();
              },
            },
            C.PAY[m]
          )
        )
      );
      const right = h('div.stack', methods);
      if (remaining > 0) {
        if (method === 'cash') {
          right.append(
            h('div.group-label', { style: { margin: '4px 0 0' } }, 'Cash received'),
            h('div.chips', cashSuggestions(remaining).map((v, i) => h('button.chip', { type: 'button', style: { minHeight: '52px', fontSize: '16px' }, onclick: () => tender('cash', v) }, i === 0 ? 'Exact ' + U.peso(v) : U.peso(v, true))))
          );
          const go = h('button.btn.go.lg.block', { type: 'button', disabled: true, onclick: () => tender('cash', entered) }, 'Type an amount');
          const kp = ui().keypad((v) => {
            entered = v;
            go.disabled = !(entered > 0);
            U.mount(go, entered >= remaining ? 'Take ' + U.peso(entered) + ' · change ' + U.peso(entered - remaining) : entered > 0 ? 'Take ' + U.peso(entered) + ' (part)' : 'Type an amount');
          }, 0, { placeholder: 'Other amount' });
          right.append(kp.el, go);
        } else {
          const needsRef = method === 'gcash' || method === 'maya' || method === 'card';
          const refIn = h('input.input', { placeholder: needsRef ? 'Reference no. (from the customer’s screen)' : 'Reference (optional)', 'aria-label': 'Reference number', inputmode: method === 'card' ? 'text' : 'numeric', maxlength: 40, value: ref });
          refIn.addEventListener('input', () => (ref = refIn.value));
          entered = entered || remaining;
          const go = h('button.btn.go.lg.block', { type: 'button', onclick: () => tender(method, entered) }, 'Record');
          const kp = ui().keypad((v) => {
            entered = v;
            go.disabled = !(entered > 0) || entered > remaining;
            U.mount(go, entered > remaining ? 'More than due. Use cash for change.' : 'Record ' + U.peso(entered) + ' ' + C.PAY[method]);
          }, entered);
          right.append(refIn, kp.el, go);
        }
      }
      s.setBody(h('div.pay', left, right));
    }
    draw();

    function done(order) {
      s.setTitle('Paid · Order #' + order.queue);
      const change = L.changeDue(order.payments);
      const text = M.print.receipt(order);
      const paper = h('pre.paper', { class: S.settings.print.paper === 80 ? 'w80' : 'w58', tabindex: '0', 'aria-label': 'Receipt preview' }, text);
      const newBtn = h('button.btn.primary.lg', { type: 'button', autofocus: true, onclick: () => s.close() }, 'New order');
      s.setBody(
        h(
          'div.done-grid',
          h(
            'div.stack',
            h(
              'div.change-hero',
              change > 0 ? [h('div.lbl', 'Change'), h('div.big', U.peso(change))] : [h('div.lbl', 'Paid in full'), h('div.big', { style: { color: 'var(--ok)' } }, U.peso(order.totals.total))],
              h('div.q', 'Order #' + order.queue),
              h('div.muted', order.no + ' · ' + order.payments.map((p) => C.PAY[p.method]).join(' + '))
            ),
            h(
              'div.stack-sm',
              h('button.btn.lg.block', { type: 'button', onclick: () => M.print.printText(M.print.receipt(order)) }, ui().icon('print', 20), 'Print receipt'),
              h('button.btn.block', { type: 'button', onclick: () => M.print.printText(M.print.kitchen(order)) }, ui().icon('fire', 20), 'Kitchen ticket')
            )
          ),
          paper
        )
      );
      s.setFoot(newBtn);
      requestAnimationFrame(() => newBtn.focus());
      if (S.settings.print.autoReceipt) M.print.printText(text);
      if (S.settings.print.kitchenTicket && order.type !== 'dine') setTimeout(() => M.print.printText(M.print.kitchen(order)), 900);
    }
  }

  /* ---------- tickets ---------- */
  function nameTicket() {
    return new Promise((res) => {
      let done = false;
      const c = S.cart;
      const s = ui().sheet({ title: 'Name this ticket', cls: 'narrow', onClose: () => !done && res(false) });
      const tbl = h('input.input', { value: c.table || '', placeholder: 'Table no.', 'aria-label': 'Table number', inputmode: 'numeric', maxlength: 10 });
      const nm = h('input.input', { value: c.customer || '', placeholder: 'Customer name', 'aria-label': 'Customer name', maxlength: 40 });
      s.setBody(
        h('p.lead', 'So you can find it again when they are ready to pay.'),
        h('div.chips', ['1', '2', '3', '4', '5', '6', '7', '8'].map((n) => h('button.chip', { type: 'button', style: { minWidth: '52px', justifyContent: 'center' }, onclick: () => (tbl.value = n) }, 'T' + n))),
        h('div.form-grid', { style: { marginTop: '12px' } }, tbl, nm)
      );
      s.setFoot(
        h(
          'button.btn.primary.lg.block',
          {
            type: 'button',
            onclick: () => {
              if (!tbl.value.trim() && !nm.value.trim()) {
                ui().toast('Enter a table number or a name.', 'err');
                return;
              }
              C.setCart({ table: tbl.value.trim(), customer: nm.value.trim() });
              done = true;
              res(true);
              s.close();
            },
          },
          'Hold ticket'
        )
      );
    });
  }

  async function hold() {
    const c = S.cart;
    if (!c.lines.length) return;
    if (!c.table && !c.customer && !(await nameTicket())) return;
    try {
      const held = await C.holdCart();
      ui().toast('Held ' + (held.table ? 'Table ' + held.table : held.customer) + '. Find it under Tickets.', 'ok');
      if (S.settings.print.kitchenTicket) M.print.printText(M.print.kitchen(held));
      ui().closeAll();
    } catch (e) {
      ui().toast(e.message, 'err');
    }
  }

  function openTickets() {
    const s = ui().sheet({ title: 'Open tickets', icon: 'clock' });
    const draw = () => {
      const list = S.open.filter((o) => o.id !== S.cart.id);
      if (!list.length) {
        s.setBody(ui().empty('No open tickets', 'Hold a dine-in order to keep it open until the table pays.'));
        return;
      }
      s.setBody(
        h(
          'div.list',
          list.map((o) => {
            const t = L.totals(o, { vat: !!S.settings.business.vat });
            return h(
              'button.row',
              {
                type: 'button',
                onclick: async () => {
                  await C.resume(o.id);
                  s.close();
                  if (matchMedia('(max-width: 760px)').matches) ticketSheet();
                },
              },
              ui().icon(o.type === 'dine' ? 'dine' : o.type === 'take' ? 'take' : 'delivery'),
              h('div.grow', h('div.t', (o.table ? 'Table ' + o.table : '') + (o.table && o.customer ? ' · ' : '') + (o.customer || '')), h('div.s', t.items + ' items · held ' + U.ago(o.heldAt || o.createdAt))),
              h('span.amt', U.peso(t.total)),
              ui().icon('right', 18)
            );
          })
        )
      );
    };
    draw();
  }

  function orderMenu() {
    const c = S.cart;
    const s = ui().sheet({ title: 'Order actions', cls: 'narrow' });
    const act = (icon, title, sub, fn, danger) => h('button.row', { type: 'button', class: danger ? 'danger' : '', onclick: fn }, ui().icon(icon), h('div.grow', h('div.t', { style: danger ? { color: 'var(--bad)' } : null }, title), sub ? h('div.s', sub) : null));
    s.setBody(
      h(
        'div.list',
        act('plus', 'Custom item', 'Off-menu dish or delivery fee', () => (s.close(), customItem())),
        act('fire', 'Print kitchen ticket', 'Send this order to the kitchen printer', () => {
          if (!c.lines.length) return ui().toast('Add items first.', 'err');
          M.print.printText(M.print.kitchen(c));
          s.close();
        }),
        act('trash', c.held ? 'Delete this ticket' : 'Clear order', c.lines.some((l) => l.sent) ? 'Needs a manager: the kitchen has it' : 'Start over', async () => {
          if (!c.lines.length && !c.held) return s.close();
          let ap = null;
          if (c.lines.some((l) => l.sent)) {
            ap = await ui().approve('void', 'Approve clearing', 'This ticket was sent to the kitchen.');
            if (!ap) return;
          } else if (!(await ui().confirm({ title: 'Clear this order?', message: 'All ' + c.lines.length + ' items will be removed.', ok: 'Clear order', danger: true }))) return;
          await C.clearCart(ap);
          s.close();
          ui().closeAll();
        }, true)
      )
    );
  }

  function customItem() {
    let amount = 0;
    const s = ui().sheet({ title: 'Custom item', cls: 'narrow' });
    const nm = h('input.input', { placeholder: 'What is it? e.g. Delivery fee', 'aria-label': 'Item name', maxlength: 40 });
    const kp = ui().keypad((v) => (amount = v), 0);
    s.setBody(h('div.stack', nm, kp.el));
    s.setFoot(
      h(
        'button.btn.primary.lg.block',
        {
          type: 'button',
          onclick: () => {
            if (!nm.value.trim()) return ui().toast('Name the item.', 'err');
            if (!(amount > 0)) return ui().toast('Enter a price.', 'err');
            C.addCustom(nm.value.trim(), amount, 1);
            s.close();
          },
        },
        'Add to order'
      )
    );
    setTimeout(() => nm.focus(), 50);
  }

  function ticketSheet() {
    const s = ui().sheet({ title: 'Current order', cls: 'ticket-sheet full', onClose: () => off() });
    const box = h('section.ticket.as-sheet', { style: { width: '100%' } });
    s.setBody(box);
    s.el.querySelector('.sheet-head').style.display = 'none';
    const draw = () => M.register.renderTicket(box, { sheet: true });
    const close = h('button.btn.ghost.block', { type: 'button', onclick: () => s.close() }, ui().icon('down', 20), 'Back to menu');
    s.setFoot(close);
    draw();
    const off = M.bus.on('cart', draw);
  }

  function receiptSheet(order) {
    const s = ui().sheet({ title: 'Receipt ' + order.no, icon: 'orders' });
    s.setBody(h('pre.paper', { class: S.settings.print.paper === 80 ? 'w80' : 'w58', style: { margin: '0 auto' } }, M.print.receipt(order, { copy: true })));
    s.setFoot(h('button.btn.lg', { type: 'button', onclick: () => M.print.printText(M.print.receipt(order, { copy: true })) }, ui().icon('print', 20), 'Print copy'));
  }

  M.checkout = { itemSheet, lineSheet, discountSheet, pay, hold, openTickets, orderMenu, customItem, ticketSheet, receiptSheet };
})((window.M = window.M || {}));

/* js/views/orders.js */
/* Mogoba POS: Orders: kitchen queue, today, past days; reprint, refund, void. */
(function (M) {
  'use strict';
  const U = M.util;
  const L = M.logic;
  const C = M.core;
  const S = M.state;
  const h = U.h;
  const ui = () => M.ui;

  const view = { tab: 'queue', day: null, q: '' };
  const KITCHEN = { prep: 'Preparing', ready: 'Ready', done: 'Picked up' };

  function statusBadge(o) {
    if (o.status === 'voided') return ui().badge('out', 'Voided');
    const rf = L.refundedTotal(o);
    if (rf && rf >= o.totals.total) return ui().badge('low', 'Refunded');
    if (rf) return ui().badge('low', 'Part refund');
    return null;
  }

  function summary(o) {
    const names = o.lines.map((l) => (l.qty > 1 ? l.qty + '× ' : '') + l.name + (l.variantName && l.variantName.length < 8 ? ' ' + l.variantName : ''));
    return names.slice(0, 2).join(', ') + (names.length > 2 ? ' +' + (names.length - 2) + ' more' : '');
  }

  /* Kitchen wait: green under 10 minutes, amber to 15, red after. */
  function waitClass(paidAt) {
    const m = (Date.now() - paidAt) / 60000;
    return m < 10 ? 'ok' : m < 15 ? 'warn' : 'bad';
  }

  function orderRow(o, onOpen) {
    return h(
      'button.row',
      { type: 'button', onclick: () => onOpen(o) },
      h('span.q-no', '#' + o.queue),
      h('div.grow', h('div.t.ellipsis', summary(o)), h('div.s', U.fmtTime(o.paidAt) + ' · ' + C.TYPES[o.type] + (o.table ? ' T' + o.table : '') + (o.customer ? ' · ' + o.customer : '') + ' · ' + o.payments.map((p) => C.PAY[p.method]).join(' + '))),
      statusBadge(o),
      h('span.amt', { style: o.status === 'voided' ? { textDecoration: 'line-through', color: 'var(--ink-3)' } : null }, U.peso(o.totals.total))
    );
  }

  function detail(order) {
    let o = order;
    const s = ui().sheet({ title: 'Order #' + o.queue + ' · ' + o.no, wide: true, icon: 'orders' });
    const draw = () => {
      const t = o.totals;
      const refunded = L.refundedTotal(o);
      const canAct = o.status === 'paid' && refunded < t.total;
      const info = h(
        'div.stack',
        h(
          'dl.kv',
          h('dt', 'Paid'),
          h('dd', U.fmtDateTime(o.paidAt)),
          h('dt', 'Cashier'),
          h('dd', o.by ? o.by.name : '-'),
          h('dt', 'Type'),
          h('dd', C.TYPES[o.type] + (o.table ? ' · Table ' + o.table : '')),
          o.customer ? [h('dt', 'Customer'), h('dd', o.customer)] : null,
          h('dt', 'Total'),
          h('dd.big', U.peso(t.total)),
          refunded ? [h('dt', 'Refunded'), h('dd', { style: { color: 'var(--bad)' } }, '−' + U.peso(refunded))] : null,
          C.can('reports') ? [h('dt', 'Food cost'), h('dd', U.peso(o.cogs) + (t.total ? ' · ' + U.pct(o.cogs / t.total, 0) : ''))] : null
        ),
        o.status === 'voided' ? h('div.banner.bad', ui().icon('ban'), h('div', h('b', 'Voided ' + U.fmtTime(o.voidInfo.at)), h('div.s', o.voidInfo.reason + ' · approved by ' + (o.voidInfo.approver ? o.voidInfo.approver.name : '-') + (o.voidInfo.restock ? ' · restocked' : '')))) : null,
        (o.refunds || []).map((r) => h('div.banner', ui().icon('refund'), h('div', h('b', 'Refund ' + U.peso(r.amount) + ' · ' + C.PAY[r.method]), h('div.s', U.fmtDateTime(r.at) + ' · ' + r.reason + ' · ' + (r.restock ? 'restocked' : 'not restocked') + ' · ' + (r.approver ? r.approver.name : ''))))),
        o.status === 'paid'
          ? h(
              'div',
              h('div.group-label', 'Kitchen'),
              ui().seg(Object.entries(KITCHEN).map(([k, v]) => [k, v]), o.kitchen || 'done', async (v) => {
                o = await C.setKitchen(o, v);
              }, 'Kitchen status')
            )
          : null,
        h(
          'div.stack-sm',
